<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlad — words we learned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* GSAP style — neon playground in midnight void (Admin/Design Styles/DESIGN gsap.md) */
  :root { --void:#0e100f; --cream:#fffce1; --olive:#42433d; --ash:#7c7c6f;
    --q-bg:#151715; --q-fg:#fffce1; --q-line:#42433d; --q-accent:#d7ff3e; --q-onaccent:#0e100f;
    --q-scrim:rgba(0,0,0,.72); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Inter Tight',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--void); color:var(--cream); letter-spacing:-0.01em;
    padding:40px 24px 64px; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1100px; margin:0 auto; }
  .tag { font-size:14px; color:var(--cream); opacity:.85; margin-bottom:16px; }
  .top {
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:20px; margin-bottom:18px;
  }
  h1 { font-size:clamp(38px,8vw,72px); font-weight:400; line-height:.95;
       letter-spacing:-0.03em; color:var(--cream); }
  .datepill { display:flex; align-items:center; gap:10px; font-size:15px; color:var(--cream); }
  #dateSel {
    font:inherit; font-size:15px; color:var(--cream); background:transparent;
    border:1px solid var(--cream); border-radius:100px; padding:9px 18px; cursor:pointer;
    letter-spacing:-0.01em;
  }
  #dateSel option { background:var(--void); color:var(--cream); }
  .hint { font-size:16px; color:var(--ash); margin-bottom:26px; }
  .rule { height:1px; background:var(--olive); width:100%; margin-bottom:32px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .card {
    background:var(--void); border:1px solid var(--olive); border-radius:8px;
    padding:20px 22px; display:flex; flex-direction:column; align-items:flex-start;
    gap:12px; min-height:120px;
  }
  .crow { display:flex; align-items:center; justify-content:space-between; width:100%; gap:10px; }
  .meta { font-size:14px; }
  .ctl-group { display:flex; align-items:center; gap:8px; }  /* matched controls, top-right */
  .ctl {
    width:32px; height:32px; border-radius:100px; border:1px solid var(--olive);
    background:transparent; color:var(--racc); cursor:pointer; padding:0;
    display:inline-flex; align-items:center; justify-content:center; transition:.15s;
  }
  .ctl svg { width:17px; height:17px; display:block; }
  .ctl:hover { border-color:var(--racc); }
  .ctl.open { background:var(--racc); color:var(--void); border-color:var(--racc); }
  .pic { font-size:34px; line-height:1; }
  .picimg { width:46px; height:46px; object-fit:contain; display:block; }
  .word {
    font-size:23px; font-weight:500; line-height:1.15; letter-spacing:-0.015em;
    cursor:pointer; user-select:none;
  }
  .word:active { opacity:.6; }
  .gloss { font-size:16px; color:var(--cream); line-height:1.35; }
  .gloss[dir="rtl"] { text-align:right; }
  .gloss.hidden { display:none; }
  footer { color:var(--ash); font-size:13px; margin-top:44px; }
  #grid{align-items:start}
  .ctl-txt{font:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;width:auto;padding:0 14px}
  .colls{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .colls.hidden{display:none}
  .collcap{width:100%;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .coll{border:1px solid;border-radius:100px;padding:6px 12px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">{ vocab review }</div>
    <div class="top">
      <h1>Words we learned</h1>
      <div class="datepill"><span>Lesson</span><select id="dateSel"></select></div>
    </div>
    <p class="hint">Tap a word to hear it &nbsp;·&nbsp; tap the eye for the meaning &nbsp;·&nbsp; tap «with» for the words it goes with</p>
    <div class="rule"></div>
    <div id="grid"></div>
    <footer>{ Vlad · vocab review }</footer>
  </div>
<script>
  const DATA = {"2026-10-08": [{"w": "nice and even", "g": "smooth and regular, with no lumps or gaps; «nice and» + adjective is a warm way to say «very»", "e": "", "c": ["nice and warm", "nice and easy", "nice and slow", "nice and early"], "q": "Spread the butter across the pan so it melts ___."}, {"w": "ultimately", "g": "in the end; when everything has been considered", "e": "", "c": ["Ultimately, it's your decision", "ultimately responsible for", "it ultimately depends on"], "q": "We test a lot of ideas, but ___ the users decide what stays."}, {"w": "to make a difference", "g": "to have an important effect", "e": "", "c": ["make a big difference", "make all the difference", "make a difference to something", "it makes no difference"], "q": "One extra review before release can really ___: we catch half the bugs there.", "qa": "make a difference"}, {"w": "metacognition", "g": "thinking about your own thinking; knowing how you learn best", "e": "", "c": ["develop metacognition", "foster metacognition", "metacognitive skills"], "q": "Knowing which study methods work for you is called ___."}, {"w": "to foster something", "g": "to help something develop over time", "e": "", "c": ["foster trust", "foster collaboration", "foster innovation", "foster a culture of feedback"], "q": "Good managers ___ trust in the team.", "qa": "foster"}, {"w": "to crave something", "g": "to want something very strongly, often food", "e": "", "c": ["crave sugar", "crave attention", "a craving for something", "satisfy a craving"], "q": "After a week of sausages I was ___ fish.", "qa": "craving"}, {"w": "a spatula", "g": "a kitchen tool with a wide flat blade, for lifting, turning or spreading", "e": "", "c": ["a wooden spatula", "flip it with a spatula", "scrape the bowl with a spatula"], "q": "Turn the pancake over with ___."}, {"w": "fine dining", "g": "expensive, high-quality restaurant food and service", "e": "", "c": ["a fine-dining restaurant", "a fine-dining experience", "Michelin-starred fine dining"], "q": "It's not a café, it's ___: five courses and a long wine list."}, {"w": "to wine and dine someone", "g": "to take someone out for good food and drink, often to win their support", "e": "", "c": ["wine and dine clients", "wine and dine investors", "be wined and dined"], "q": "Before the deal, the sales team ___ the new client in Munich.", "qa": "wined and dined"}, {"w": "off the top of my head", "g": "without checking or thinking about it carefully", "e": "", "c": ["I can't remember off the top of my head", "Off the top of my head, I'd say…"], "q": "How many users? Hmm, ___, I'd say about two million."}]}, DATES = ["2026-10-08"];
  const GLOSS_LABEL = "definition", GLOSS_DIR = "ltr";
  const ACC = ["#0ae448", "#fec5fb", "#ff8709", "#9d95ff", "#00bae2", "#abff84"];

  const sel = document.getElementById('dateSel'), grid = document.getElementById('grid');
  /* Show dates as "29 July 2026" but keep the ISO string as the option value (the DATA key). */
  const _MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fmtDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m ? (+m[3])+' '+_MONTHS[+m[2]-1]+' '+m[1] : iso; }
  DATES.forEach(d => { const o=document.createElement('option'); o.value=d; o.textContent=fmtDate(d); sel.appendChild(o); });

  /* Voice locked to Google UK English Female (same as Space Lotto / Dino Squad) */
  let vcVoice = null;
  function vcLoad(){
    const vs = speechSynthesis.getVoices();
    vcVoice =
      vs.find(v => v.name === 'Google UK English Female') ||
      vs.find(v => /google/i.test(v.name) && /en-GB/i.test(v.lang)) ||
      vs.find(v => /en-GB/i.test(v.lang) && /female|samantha|kate|serena|stephanie/i.test(v.name)) ||
      vs.find(v => /en-GB/i.test(v.lang)) ||
      vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){ vcLoad(); speechSynthesis.onvoiceschanged = vcLoad; }
  /* Chrome drops an utterance queued in the SAME tick as cancel(), and parks the
     queue when the tab has been idle — that is why the quiz sentence stayed silent
     until you tapped 🔊 (Dasha, 2026-08-25). resume() + a tick of delay fixes both.
     If no voice has loaded yet, wait for voiceschanged once rather than speaking
     into the void. */
  function speak(t){
    if(!('speechSynthesis'in window)) return;
    const go = () => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = vcVoice ? vcVoice.lang : 'en-GB'; u.rate=.9; u.pitch=1.0;
      if(vcVoice) u.voice = vcVoice;
      speechSynthesis.cancel();
      setTimeout(() => {
        try { speechSynthesis.resume(); } catch(e){}
        speechSynthesis.speak(u);
      }, 60);
    };
    if(!vcVoice && speechSynthesis.getVoices().length === 0){
      speechSynthesis.addEventListener('voiceschanged', function once(){
        speechSynthesis.removeEventListener('voiceschanged', once);
        vcLoad(); go();
      });
      setTimeout(go, 500);   // safety net if the event never fires
      return;
    }
    go();
  }
  function isImg(e){ return /^(https?:|data:)/i.test(e) || /\.(png|jpe?g|svg|webp|gif)(\?|$)/i.test(e); }

  /* ---------------- Practise quiz ----------------------------------------------
     Maksim's idea (2026-08-03): something to actually DRILL the lesson's words with.
     Pick the word/phrase that fits the sentence. Only appears for a lesson whose
     items carry a practice sentence (the " | ... ___ ..." field in the library), so
     pages without sentences look exactly as before. Themed via --q-* vars. */
  const qzStyle = document.createElement('style');
  qzStyle.textContent = `
    #qzOpen { font:inherit; font-size:14px; cursor:pointer; white-space:nowrap;
      border:1px solid var(--q-line,#ccc); background:var(--q-accent,#111); color:var(--q-onaccent,#fff);
      border-radius:100px; padding:9px 18px; }
    #qzOpen[hidden] { display:none; }
    #qz { position:fixed; inset:0; z-index:60; background:var(--q-scrim,rgba(0,0,0,.55));
      display:flex; align-items:center; justify-content:center; padding:20px; }
    #qz[hidden] { display:none; }
    .qz-box { background:var(--q-bg,#fff); color:var(--q-fg,#222); border:1px solid var(--q-line,#ddd);
      border-radius:16px; width:min(620px,100%); max-height:90vh; overflow:auto; padding:24px; }
    .qz-top { display:flex; align-items:center; justify-content:space-between; gap:12px;
      font-size:14px; opacity:.75; margin-bottom:18px; }
    .qz-x { font:inherit; font-size:20px; line-height:1; cursor:pointer; background:none;
      border:none; color:inherit; padding:4px 8px; }
    .qz-q { font-size:20px; line-height:1.5; margin-bottom:20px; }
    .qz-gap { display:inline-block; min-width:74px; border-bottom:2.5px solid var(--q-accent,#111);
      margin:0 4px; text-align:center; font-weight:600; }
    .qz-opts { display:grid; gap:10px; }
    .qz-opt { font:inherit; font-size:17px; text-align:left; cursor:pointer; padding:13px 16px;
      border:1px solid var(--q-line,#ddd); border-radius:10px; background:transparent; color:inherit; }
    .qz-opt:hover:not(:disabled) { border-color:var(--q-accent,#111); }
    .qz-opt:disabled { cursor:default; }
    .qz-opt.right { border-color:#22a45d; background:rgba(34,164,93,.16); font-weight:600; }
    .qz-opt.wrong { border-color:#e0574a; background:rgba(224,87,74,.14); }
    .qz-next { font:inherit; font-size:15px; cursor:pointer; margin-top:20px; padding:11px 22px;
      border-radius:100px; border:none; background:var(--q-accent,#111); color:var(--q-onaccent,#fff); }
    .qz-said { margin-top:16px; font-size:16px; opacity:.8; cursor:pointer; }
    .qz-score { font-size:40px; font-weight:600; margin:10px 0 6px; }
  `;
  document.head.appendChild(qzStyle);

  const qzBtn = document.createElement('button');
  qzBtn.id = 'qzOpen'; qzBtn.type = 'button'; qzBtn.hidden = true;
  qzBtn.textContent = 'Practise these words';
  sel.parentElement.appendChild(qzBtn);

  const qz = document.createElement('div');
  qz.id = 'qz'; qz.hidden = true;
  qz.innerHTML = '<div class="qz-box"><div class="qz-top"><span id="qzProg"></span>'
    + '<button class="qz-x" id="qzX" type="button" aria-label="Close">&times;</button></div>'
    + '<div id="qzBody"></div></div>';
  document.body.appendChild(qz);
  const qzBody = document.getElementById('qzBody'), qzProg = document.getElementById('qzProg');

  const qzItems = d => (DATA[d] || []).filter(it => it.q);
  function syncPractise(d){ qzBtn.hidden = qzItems(d).length < 3; }
  sel.addEventListener('change', () => syncPractise(sel.value));
  setTimeout(() => syncPractise(sel.value), 0);

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  let qzQs = [], qzAt = 0, qzScore = 0, qzRecent = [];

  /* Options are shuffled per question, and a position is rejected if it would make a
     run of three identical correct slots. Kids read the pattern, not the question. */
  function qzOptions(correct, pool){
    const bag = shuffle(pool.filter(w => w !== correct)).slice(0, 3);
    let opts, at, tries = 0;
    do {
      opts = shuffle([correct, ...bag]);
      at = opts.indexOf(correct);
      tries++;
    } while (tries < 15 && qzRecent.length >= 2 &&
             qzRecent[qzRecent.length-1] === at && qzRecent[qzRecent.length-2] === at);
    qzRecent.push(at);
    return opts;
  }

  function qzStart(){
    const items = qzItems(sel.value);
    /* qa = the form the word takes in THIS sentence ("to flirt" on the card,
       "flirt" after "did not"). Falls back to the dictionary form. */
    const pool = items.map(it => it.qa || it.w);
    qzQs = shuffle(items.slice()).map(it => ({ it, opts: qzOptions(it.qa || it.w, pool) }));
    qzAt = 0; qzScore = 0;
    qz.hidden = false;
    qzShow();
  }

  function qzShow(){
    if (qzAt >= qzQs.length) return qzEnd();
    const { it, opts } = qzQs[qzAt];
    qzProg.textContent = (qzAt + 1) + ' / ' + qzQs.length;
    const sentence = esc(it.q).split('___').join('<span class="qz-gap">?</span>');
    qzBody.innerHTML = '<div class="qz-q">' + sentence + '</div><div class="qz-opts"></div>';
    const box = qzBody.querySelector('.qz-opts');
    opts.forEach(w => {
      const b = document.createElement('button');
      b.className = 'qz-opt'; b.type = 'button'; b.textContent = w;
      b.onclick = () => qzAnswer(b, w, it);
      box.appendChild(b);
    });
  }

  function qzAnswer(btn, chosen, it){
    const ans = it.qa || it.w;
    const right = chosen === ans;
    if (right) qzScore++;
    qzBody.querySelectorAll('.qz-opt').forEach(b => {
      b.disabled = true;
      if (b.textContent === ans) b.classList.add('right');
      else if (b === btn) b.classList.add('wrong');
    });
    // show the finished sentence and read it aloud, so the phrase is heard in context
    const full = it.q.split('___').join(ans);
    qzBody.querySelector('.qz-q').innerHTML = esc(full).replace(esc(ans),
      '<span style="font-weight:600;border-bottom:2.5px solid var(--q-accent,#111)">' + esc(ans) + '</span>');
    const said = document.createElement('div');
    said.className = 'qz-said';
    // when the sentence used an inflected form, remind them of the dictionary form
    said.textContent = (it.qa ? it.w + ' — ' : '') + (it.g ? it.g + '  ' : '') + '🔊';
    /* NEVER speak on its own here. Dasha, 2026-08-25: the finished sentence must be
       read ONLY when the pupil asks for it by tapping 🔊 — an automatic voice fires
       while she is still talking in the lesson. */
    said.onclick = () => speak(full);
    qzBody.appendChild(said);
    const next = document.createElement('button');
    next.className = 'qz-next'; next.type = 'button';
    next.textContent = qzAt + 1 >= qzQs.length ? 'See result' : 'Next';
    next.onclick = () => { qzAt++; qzShow(); };
    qzBody.appendChild(next);
    next.focus();
  }

  function qzEnd(){
    qzProg.textContent = 'Done';
    qzBody.innerHTML = '<div class="qz-score">' + qzScore + ' / ' + qzQs.length + '</div>'
      + '<div style="opacity:.75">' + (qzScore === qzQs.length ? 'Every one right.'
        : qzScore * 2 >= qzQs.length ? 'Good going. Try the ones you missed again.'
        : 'Worth another run through these.') + '</div>';
    const again = document.createElement('button');
    again.className = 'qz-next'; again.type = 'button'; again.textContent = 'Try again';
    again.onclick = qzStart;
    qzBody.appendChild(again);
  }

  function qzClose(){ qz.hidden = true; if('speechSynthesis' in window) speechSynthesis.cancel(); }
  qzBtn.onclick = qzStart;
  document.getElementById('qzX').onclick = qzClose;
  qz.addEventListener('click', e => { if (e.target === qz) qzClose(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !qz.hidden) qzClose(); });

  const SPK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.8 6a8 8 0 0 1 0 12"/></svg>`;
  const EYE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
  function render(date){
    grid.innerHTML='';
    (DATA[date]||[]).forEach((it,i)=>{
      const acc = ACC[i % ACC.length];
      const card=document.createElement('div'); card.className='card';
      card.style.borderColor = acc; card.style.setProperty('--racc', acc);

      const top=document.createElement('div'); top.className='crow';
      const meta=document.createElement('div'); meta.className='meta';
      meta.textContent = '{ '+String(i+1).padStart(2,'0')+' }'; meta.style.color = acc;
      top.appendChild(meta);

      const grp=document.createElement('div'); grp.className='ctl-group';
      const spk=document.createElement('button'); spk.className='ctl'; spk.title='listen';
      spk.setAttribute('aria-label','listen'); spk.innerHTML=SPK_SVG; spk.onclick=()=>speak(it.w);
      grp.appendChild(spk);
      top.appendChild(grp);
      card.appendChild(top);

      if(it.e){
        const pic=document.createElement('div'); pic.className='pic';
        if(isImg(it.e)){ const im=document.createElement('img'); im.className='picimg'; im.src=it.e; im.alt=''; pic.appendChild(im); }
        else { pic.textContent=it.e; }
        card.appendChild(pic);
      }

      const w=document.createElement('div'); w.className='word'; w.style.color=acc;
      w.textContent=it.w; w.onclick=()=>speak(it.w);
      card.appendChild(w);

      if(it.g){
        const gl=document.createElement('div'); gl.className='gloss hidden'; gl.textContent=it.g;
        card.appendChild(gl);
        const rev=document.createElement('button'); rev.className='ctl'; rev.title=GLOSS_LABEL;
        rev.setAttribute('aria-label',GLOSS_LABEL); rev.innerHTML=EYE_SVG;
        rev.onclick=()=>{ gl.classList.toggle('hidden'); rev.classList.toggle('open'); };
        grp.appendChild(rev);
      }
      if(it.c && it.c.length){
        const cl=document.createElement('div'); cl.className='colls hidden';
        const cap=document.createElement('div'); cap.className='collcap'; cap.textContent='collocations'; cl.appendChild(cap);
        it.c.forEach(c=>{ const ch=document.createElement('span'); ch.className='coll'; ch.textContent=c; ch.style.borderColor=acc; ch.onclick=()=>speak(c); cl.appendChild(ch); });
        card.appendChild(cl);
        const cb=document.createElement('button'); cb.className='ctl ctl-txt'; cb.title='collocations';
        cb.setAttribute('aria-label','collocations'); cb.textContent='with';
        cb.onclick=()=>{ cl.classList.toggle('hidden'); cb.classList.toggle('open'); };
        grp.appendChild(cb);
      }
      grid.appendChild(card);
    });
  }
  sel.onchange=()=>render(sel.value);
  if(DATES.length){ sel.value=DATES[0]; render(DATES[0]); }
  else grid.innerHTML='<p style="color:var(--ash)">No words yet.</p>';
</script>
</body>
</html>
