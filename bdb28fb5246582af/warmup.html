<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erin's Warm-Up Spinner</title>
<style>
  @font-face { font-family:'Rubik'; src:local('Rubik'); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Rubik','Segoe UI',Arial,sans-serif;
    min-height:100vh; color:#3a2a63;
    background:
      radial-gradient(circle at 12% 18%, #ede9fe 0, transparent 42%),
      radial-gradient(circle at 88% 82%, #e0e7ff 0, transparent 46%),
      #f7f5ff;
    display:flex; flex-direction:column; align-items:center;
    padding:16px 14px 34px;
  }
  h1 { font-size:26px; color:#5b21b6; margin-bottom:2px; }
  h1 .em { font-size:26px; }
  .tag { font-size:13.5px; color:#7c6aa8; margin-bottom:14px; }

  .stage { display:flex; gap:26px; flex-wrap:wrap; justify-content:center; align-items:flex-start; width:100%; max-width:900px; }

  /* Wheel */
  .wheel-wrap { position:relative; width:340px; height:340px; flex:none; }
  .pointer {
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent;
    border-top:26px solid #f59e0b; z-index:5; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .wheel {
    width:340px; height:340px; border-radius:50%;
    border:8px solid #fff; box-shadow:0 8px 26px rgba(91,33,182,.28);
    transition:transform 3.6s cubic-bezier(.17,.67,.16,1);
    position:relative;
  }
  .wheel .lbl {
    position:absolute; top:50%; left:50%; width:96px; margin-left:-48px; margin-top:-16px;
    text-align:center; font-size:13px; font-weight:700; color:#fff; line-height:1.15;
    text-shadow:0 1px 2px rgba(0,0,0,.35); pointer-events:none;
  }
  .wheel .lbl .e { display:block; font-size:22px; }
  .hub {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:58px; height:58px; border-radius:50%; background:#fff; z-index:4;
    box-shadow:0 2px 8px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center;
    font-size:26px;
  }
  .spinBtn {
    display:block; margin:16px auto 0; font-family:inherit; font-weight:800; font-size:19px;
    color:#fff; border:none; border-radius:16px; padding:13px 30px; cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#a855f7); box-shadow:0 4px 0 #5b21b6;
  }
  .spinBtn:active { transform:translateY(2px); box-shadow:0 2px 0 #5b21b6; }
  .spinBtn:disabled { opacity:.6; cursor:default; }

  /* Panel */
  .panel {
    flex:1 1 320px; min-width:300px; max-width:420px; min-height:340px;
    background:#fff; border:3px solid #ddd6fe; border-radius:20px; padding:18px 20px;
    box-shadow:0 6px 20px rgba(91,33,182,.12);
  }
  .panel.idle { display:flex; align-items:center; justify-content:center; text-align:center; color:#a99cc9; font-size:17px; }
  .panel .head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .panel .head .e { font-size:34px; }
  .panel .head .name { font-size:23px; font-weight:800; color:#5b21b6; }
  .panel ul { list-style:none; }
  .panel li { font-size:17px; line-height:1.5; padding:7px 0 7px 26px; position:relative; border-bottom:1px dashed #ede9fe; }
  .panel li::before { content:"💬"; position:absolute; left:0; top:7px; font-size:15px; }
  .panel .words { margin-top:14px; }
  .panel .words .cap { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:#9b8bc4; margin-bottom:6px; }
  .chip {
    display:inline-block; background:#f3f0ff; border:1.5px solid #ddd6fe; color:#5b21b6;
    border-radius:20px; padding:4px 12px; margin:3px 4px 3px 0; font-size:14px; font-weight:600;
  }
  .wyr-q { font-size:20px; font-weight:800; color:#7c3aed; line-height:1.4; }
  .wyr-why { margin-top:10px; font-size:15px; color:#7c6aa8; }
  .foot { margin-top:16px; font-size:12px; color:#a99cc9; text-align:center; }
</style>
</head>
<body>
  <h1><span class="em">🏄‍♀️</span> Erin's Warm-Up</h1>
  <div class="tag">Spin the wheel. Talk about it in English!</div>

  <div class="stage">
    <div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="hub">🌀</div>
      </div>
      <button class="spinBtn" id="spinBtn">Spin! 🎡</button>
    </div>

    <div class="panel idle" id="panel">Spin to start! 👉</div>
  </div>

  <div class="foot">Tip: answer in a full sentence, and say a little more than one word.</div>

<script>
// Refreshed 26 Oct 2026 (Dasha: every card is a conversation, none tied to an exercise),
// content only, machinery unchanged, 9 sectors. Each card: an easy choice question first,
// then two open ones; 2-4 sentence starters.
// Kept and refreshed: Surfing, Roblox, Emma, Squishies, Yesterday, Would you rather.
// New: Bat mitzvah (her own day, Sun 25 Oct: shopping and a sushi restaurant with her
//   grandparents), My family (have got + present continuous + present simple in one chat;
//   brother 15 surfs and skateboards), Halloween (door to door for sweets in Israel, 14 Oct).
// Retired: Birthdays (dates practice; her birthday has passed), Weather (spun many times),
//   Hair and eyes (folded into Emma and My family). USA or Japan pair dropped (answered 22 Oct).
const TOPICS = [
  { e:'🏄‍♀️', name:'Surfing', color:'#7c3aed',
    qs:['Were the waves big or small this week?','How often do you surf?','What do you like about surfing?'],
    words:['The waves were…','I surf every…','I like it because…'] },
  { e:'🎉', name:'Bat mitzvah', color:'#f59e0b',
    qs:['Was your bat mitzvah day fun or quiet?','What did you do with your grandma and grandpa?','What presents did you get?'],
    words:['It was…','We went…','We ate…','I got…'] },
  { e:'🎮', name:'Roblox', color:'#a855f7',
    qs:['Do you play Roblox with Emma or by yourself?',"What's your favourite Roblox game this week?",'What have you got in the game?'],
    words:['I play with…','My favourite game is…',"I've got…"] },
  { e:'👭', name:'Emma', color:'#ec4899',
    qs:['Is Emma tall or short?',"Tell me about Emma's hair and eyes.",'What do you and Emma do together?'],
    words:["She's got…",'Her hair is…','Together we…'] },
  { e:'👨‍👩‍👧‍👦', name:'My family', color:'#0ea5e9',
    qs:['Has your brother got long hair or short hair?',"What's your mum doing right now?",'What does your dad make for dinner?'],
    words:["He's got…","Right now she's…",'He makes…'] },
  { e:'🗓️', name:'Yesterday', color:'#14b8a6',
    qs:['Did you go surfing yesterday or stay at home?','What did you do after school?','What else did you do?'],
    words:['I went…','I played…','It was…'] },
  { e:'🎃', name:'Halloween', color:'#f97316',
    qs:['Is Halloween fun or scary?','What do you do at Halloween?','What costume would you like this year?'],
    words:["It's … because…",'We go…',"I'd like to be…"] },
  { e:'🍌', name:'Squishies', color:'#22c55e',
    qs:['Which is your favourite: the dumpling, the eye or the banana?',"How many squishies have you got now?",'Where do you keep them?'],
    words:['My favourite is…',"I've got … squishies","They're in…"] },
  { e:'🤔', name:'Would you rather', color:'#ef4444', wyr:true,
    words:["I'd rather…","because it's…","it's too … to…"],
    pairs:[['go outside in the rain','fly in the rain'],
           ['live in the coldest country','live in the hottest country'],
           ['live in a palace','live on a houseboat'],
           ['play Roblox all day','watch films all day'],
           ['have curly hair','have straight hair'],
           ['get lost in a maze','get stuck in a bookshop'],
           ['eat sushi every day','eat pizza every day'],
           ['surf with dolphins','swim with sea lions']] }
];

const n = TOPICS.length;
const seg = 360 / n;
const wheel = document.getElementById('wheel');
const panel = document.getElementById('panel');
const spinBtn = document.getElementById('spinBtn');

// conic-gradient background
const stops = TOPICS.map((t,i)=>`${t.color} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
wheel.style.background = `conic-gradient(${stops})`;

// labels
TOPICS.forEach((t,i)=>{
  const mid = i*seg + seg/2;
  const d = document.createElement('div');
  d.className = 'lbl';
  d.innerHTML = `<span class="e">${t.e}</span>${t.name}`;
  d.style.transform = `rotate(${mid}deg) translateY(-118px) rotate(${-mid}deg)`;
  wheel.appendChild(d);
});

let rotation = 0, spinning = false, lastIdx = -1;
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
// never land on the same sector twice in a row
function pickIdx(){ let i; do { i = randInt(0, n-1); } while(i === lastIdx); lastIdx = i; return i; }

function showTopic(i){
  const t = TOPICS[i];
  panel.classList.remove('idle');
  if(t.wyr){
    const p = t.pairs[randInt(0, t.pairs.length-1)];
    panel.innerHTML = `
      <div class="head"><span class="e">${t.e}</span><span class="name">${t.name}…</span></div>
      <div class="wyr-q">${p[0]}<br>&nbsp;&nbsp;or<br>${p[1]}?</div>
      <div class="wyr-why">Pick one and say <b>why</b>: I'd rather … because it's … 🙂</div>
      <div class="words"><div class="cap">Helpful words</div>${t.words.map(w=>`<span class="chip">${w}</span>`).join('')}</div>`;
    return;
  }
  panel.innerHTML = `
    <div class="head"><span class="e">${t.e}</span><span class="name">${t.name}</span></div>
    <ul>${t.qs.map(q=>`<li>${q}</li>`).join('')}</ul>
    <div class="words"><div class="cap">Helpful words</div>${t.words.map(w=>`<span class="chip">${w}</span>`).join('')}</div>`;
}

function spin(){
  if(spinning) return;
  spinning = true; spinBtn.disabled = true;
  const i = pickIdx();
  const segMid = i*seg + seg/2;
  const targetMod = (360 - segMid + 360) % 360;
  const currentMod = ((rotation % 360) + 360) % 360;
  const delta = (targetMod - currentMod + 360) % 360;
  rotation += 360*5 + delta;
  wheel.style.transform = `rotate(${rotation}deg)`;
  wheel.addEventListener('transitionend', function done(){
    wheel.removeEventListener('transitionend', done);
    showTopic(i);
    spinning = false; spinBtn.disabled = false;
    spinBtn.textContent = 'Spin again 🎡';
  }, { once:true });
}

spinBtn.addEventListener('click', spin);
</script>
</body>
</html>
