<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman — words we learned</title>
<style>
:root{--ink:#253a34;--muted:#626a62;--line:#d8ddd3;--paper:#f4f2ec;--accent:#31594b;
--q-bg:#fffefa;--q-fg:#253a34;--q-line:#ced5ca;--q-accent:#31594b;--q-onaccent:#fff;--q-scrim:rgba(28,40,34,.48)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh;padding:54px 24px 32px;border-top:5px solid var(--accent)}
.wrap{max-width:960px;margin:auto}
.masthead{display:flex;justify-content:space-between;align-items:center;padding-bottom:19px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted)}
.masthead strong{color:var(--accent);font-size:13px;font-weight:600}
h1{font-family:Georgia,'Times New Roman',serif;font-size:44px;line-height:1.17;font-weight:400;letter-spacing:-.7px;margin:34px 0 13px}
.hint{font-size:15px;line-height:1.6;color:var(--muted);margin-bottom:30px}
.top{margin-bottom:18px}
.datepill{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.datepill label{font-size:13px;font-weight:600;color:var(--muted)}
#dateSel{font:inherit;font-size:14px;color:var(--ink);background:#fffefa;border:1px solid var(--line);border-radius:4px;padding:11px 34px 11px 12px;min-height:44px;cursor:pointer}
.classic #qzOpen{margin-left:auto;border-radius:4px;padding:12px 20px;min-height:44px;font-weight:600}
#grid{background:#fffefa;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:18px;align-items:center;padding:24px 28px;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:0}
.number{font-size:12px;color:#797c72;font-variant-numeric:tabular-nums;align-self:start;padding-top:10px}
.word{display:inline-flex;align-items:center;gap:14px;font-family:Georgia,'Times New Roman',serif;font-size:27px;line-height:1.35;text-align:left;border:0;border-radius:3px;background:transparent;color:var(--ink);cursor:pointer;padding:0;max-width:100%;overflow-wrap:anywhere}
.word:hover{color:var(--accent)}
.word svg{width:20px;height:20px;flex-shrink:0;color:#567665}
.reveal{font:inherit;font-size:13px;line-height:1.3;border:1px solid var(--line);border-radius:4px;padding:10px 14px;min-height:44px;color:var(--accent);background:transparent;cursor:pointer}
.reveal:hover{background:#eff2eb;border-color:#8ea696}
.gloss{font-size:16px;line-height:1.6;color:var(--muted);margin-top:9px}
.gloss[hidden]{display:none}
button:focus-visible,select:focus-visible{outline:3px solid #a48042;outline-offset:4px}
footer{display:flex;justify-content:space-between;gap:16px;font-size:12px;line-height:1.5;color:var(--muted);margin-top:22px}
.classic .qz-box{border-radius:6px;padding:30px;box-shadow:0 16px 65px #1c282222}
.classic .qz-opt,.classic .qz-next{border-radius:4px}
.classic .qz-q{font-family:Georgia,'Times New Roman',serif;font-size:25px;line-height:1.5}
.classic .qz-x{min-width:44px;min-height:44px}
@media(max-width:600px){body{padding:28px 16px 24px}h1{font-size:34px;margin-top:26px}.masthead{font-size:10px;letter-spacing:1.2px}.hint{font-size:14px;margin-bottom:23px}.datepill{gap:10px}.classic #qzOpen{margin-left:0;width:100%}.card{padding:21px 17px;grid-template-columns:24px minmax(0,1fr);gap:11px}.word{font-size:24px;gap:10px}.reveal{grid-column:2;justify-self:start}.number{padding-top:7px}.gloss{font-size:15px}.classic .qz-box{padding:21px}.classic .qz-q{font-size:22px}footer{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body class="classic">
<main class="wrap">
<header><div class="masthead"><strong>Roman</strong><span>English notebook</span></div>
<h1>Words from our lessons</h1><p class="hint">Listen to each phrase. Reveal the translation when you need it.</p></header>
<div class="top"><div class="datepill"><label for="dateSel">Lesson</label><select id="dateSel"></select></div></div>
<div id="grid" aria-label="Vocabulary"></div>
<footer><span>Roman · Vocabulary</span><span id="wordCount"></span></footer>
</main>
<script>
const DATA = {"2026-09-23": [{"w": "to find yourself somewhere", "g": "оказаться где-то, не планируя", "e": "", "q": "I took the wrong metro line and ___ on the other side of the city.", "qa": "found myself"}, {"w": "to take part in something", "g": "принять участие в чём-то", "e": "", "q": "Next spring I would like to ___ a 10 km race.", "qa": "take part in"}, {"w": "to meet up with friends", "g": "встретиться с друзьями, не \"a meeting\"", "e": "", "q": "On Saturday I ___ from my old job for lunch.", "qa": "met up with friends"}, {"w": "to renew a document", "g": "продлить документ", "e": "", "q": "My residence permit expires in May, so I need to ___ before then.", "qa": "renew it"}, {"w": "a different experience", "g": "другой опыт; a, не some", "e": "", "q": "Living in Madrid is ___ from living in Moscow."}, {"w": "It was fun", "g": "было весело; не funny", "e": "", "q": "We danced at the festival until midnight. ___!"}, {"w": "such strange food", "g": "такая странная еда", "e": "", "q": "The night market had ___ that I didn't know what to try first."}, {"w": "to ride a bike", "g": "кататься на велосипеде; cycling = ехать куда-то", "e": "", "q": "On Sunday mornings I like to ___ around the park.", "qa": "ride a bike"}, {"w": "to hang out with friends", "g": "тусоваться с друзьями", "e": "", "q": "On Friday evenings I usually ___ from work.", "qa": "hang out with friends"}, {"w": "an account", "g": "рассказ о том, что произошло; не accountant", "e": "", "q": "Each passenger gave ___ of what happened on the flight."}, {"w": "a feast", "g": "пир, обильное застолье", "e": "", "q": "For the wedding they prepared ___ with twenty different dishes."}, {"w": "local customs", "g": "местные обычаи", "e": "", "q": "Before you visit a new country, it's good to learn about ___."}, {"w": "an oily taste", "g": "маслянистый вкус", "e": "", "q": "The fried fish had ___ that I didn't really like."}, {"w": "communal tables", "g": "общие столы", "e": "", "q": "That restaurant has no private tables, only ___."}], "2026-09-17": [{"w": "to depend on something", "g": "зависеть от чего-то", "e": "", "q": "September is not always the same, it ___ the year.", "qa": "depends on"}, {"w": "up to 30 degrees", "g": "до 30 градусов, не выше", "e": "", "q": "The forecast says ___, so it will not get hotter than that."}, {"w": "the rest of the summer", "g": "остальная часть лета", "e": "", "q": "There were three weeks of heat, and ___ was fine."}, {"w": "wildfires", "g": "лесные пожары", "e": "", "q": "After the heat there were ___ in the mountains near Madrid."}, {"w": "a mountain range", "g": "горный хребет", "e": "", "q": "The fires started in ___ about 100 km from the city."}, {"w": "in an hour and a half", "g": "через полтора часа", "e": "", "q": "I have to collect my children from school ___."}, {"w": "I haven't decided yet", "g": "я ещё не решил", "e": "", "q": "Maybe football, maybe something else, ___."}, {"w": "to reimburse someone", "g": "возместить кому-то расходы", "e": "", "q": "If the damage is confirmed, the insurance company will ___ you.", "qa": "reimburse"}, {"w": "a reimbursement", "g": "возмещение", "e": "", "q": "If the claim is approved, you receive ___."}, {"w": "to take photos", "g": "фотографировать, не \"make photos\"", "e": "", "q": "You do not need an expert to come out, you can ___ of the damage yourself.", "qa": "take photos"}, {"w": "on YouTube", "g": "на ютубе, не \"in\"", "e": "", "q": "There is a Spanish comedian called Nacho ___."}, {"w": "a tough market", "g": "тяжёлый рынок", "e": "", "q": "Spain is ___ because the selling culture there is completely different."}, {"w": "I find it difficult to ...", "g": "мне трудно ...", "e": "", "q": "Sometimes ___ start a conversation with someone new.", "qa": "I find it difficult to"}], "2026-09-15": [{"w": "I feel challenged", "g": "мне это даётся непросто, это вызов", "e": "", "q": "English grammar is hard for me, so sometimes ___ when I speak."}, {"w": "a range of emotions", "g": "целая гамма эмоций", "e": "", "q": "Learning a language can bring ___: joy, stress and sometimes boredom."}, {"w": "an acquaintance", "g": "знакомый, не друг", "e": "", "q": "He isn't really my friend, he's just ___ from work."}, {"w": "misleading", "g": "вводящий в заблуждение", "e": "", "q": "The photo on the menu was ___: the real dish was much smaller."}, {"w": "I've lived here for three years", "g": "я живу здесь три года", "e": "", "q": "I moved to Madrid in 2023, so ___."}]}, DATES = ["2026-09-23", "2026-09-17", "2026-09-15"];
const GLOSS_LABEL = "перевод", GLOSS_DIR = "ltr";
const ACC = ["#31594b"];

  const sel = document.getElementById('dateSel'), grid = document.getElementById('grid');
  /* Show dates as "29 July 2026" but keep the ISO string as the option value (the DATA key). */
  const _MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fmtDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m ? (+m[3])+' '+_MONTHS[+m[2]-1]+' '+m[1] : iso; }
  DATES.forEach(d => { const o=document.createElement('option'); o.value=d; o.textContent=fmtDate(d); sel.appendChild(o); });

  /* Voice locked to Google UK English Female (same as Space Lotto / Dino Squad) */
  let vcVoice = null;
  function vcLoad(){
    const vs = speechSynthesis.getVoices();
    vcVoice =
      vs.find(v => v.name === 'Google UK English Female') ||
      vs.find(v => /google/i.test(v.name) && /en-GB/i.test(v.lang)) ||
      vs.find(v => /en-GB/i.test(v.lang) && /female|samantha|kate|serena|stephanie/i.test(v.name)) ||
      vs.find(v => /en-GB/i.test(v.lang)) ||
      vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){ vcLoad(); speechSynthesis.onvoiceschanged = vcLoad; }
  /* Chrome drops an utterance queued in the SAME tick as cancel(), and parks the
     queue when the tab has been idle — that is why the quiz sentence stayed silent
     until you tapped 🔊 (Dasha, 2026-08-25). resume() + a tick of delay fixes both.
     If no voice has loaded yet, wait for voiceschanged once rather than speaking
     into the void. */
  function speak(t){
    if(!('speechSynthesis'in window)) return;
    const go = () => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = vcVoice ? vcVoice.lang : 'en-GB'; u.rate=.9; u.pitch=1.0;
      if(vcVoice) u.voice = vcVoice;
      speechSynthesis.cancel();
      setTimeout(() => {
        try { speechSynthesis.resume(); } catch(e){}
        speechSynthesis.speak(u);
      }, 60);
    };
    if(!vcVoice && speechSynthesis.getVoices().length === 0){
      speechSynthesis.addEventListener('voiceschanged', function once(){
        speechSynthesis.removeEventListener('voiceschanged', once);
        vcLoad(); go();
      });
      setTimeout(go, 500);   // safety net if the event never fires
      return;
    }
    go();
  }
  function isImg(e){ return /^(https?:|data:)/i.test(e) || /\.(png|jpe?g|svg|webp|gif)(\?|$)/i.test(e); }

  /* ---------------- Practise quiz ----------------------------------------------
     Maksim's idea (2026-08-03): something to actually DRILL the lesson's words with.
     Pick the word/phrase that fits the sentence. Only appears for a lesson whose
     items carry a practice sentence (the " | ... ___ ..." field in the library), so
     pages without sentences look exactly as before. Themed via --q-* vars. */
  const qzStyle = document.createElement('style');
  qzStyle.textContent = `
    #qzOpen { font:inherit; font-size:14px; cursor:pointer; white-space:nowrap;
      border:1px solid var(--q-line,#ccc); background:var(--q-accent,#111); color:var(--q-onaccent,#fff);
      border-radius:100px; padding:9px 18px; }
    #qzOpen[hidden] { display:none; }
    #qz { position:fixed; inset:0; z-index:60; background:var(--q-scrim,rgba(0,0,0,.55));
      display:flex; align-items:center; justify-content:center; padding:20px; }
    #qz[hidden] { display:none; }
    .qz-box { background:var(--q-bg,#fff); color:var(--q-fg,#222); border:1px solid var(--q-line,#ddd);
      border-radius:16px; width:min(620px,100%); max-height:90vh; overflow:auto; padding:24px; }
    .qz-top { display:flex; align-items:center; justify-content:space-between; gap:12px;
      font-size:14px; opacity:.75; margin-bottom:18px; }
    .qz-x { font:inherit; font-size:20px; line-height:1; cursor:pointer; background:none;
      border:none; color:inherit; padding:4px 8px; }
    .qz-q { font-size:20px; line-height:1.5; margin-bottom:20px; }
    .qz-gap { display:inline-block; min-width:74px; border-bottom:2.5px solid var(--q-accent,#111);
      margin:0 4px; text-align:center; font-weight:600; }
    .qz-opts { display:grid; gap:10px; }
    .qz-opt { font:inherit; font-size:17px; text-align:left; cursor:pointer; padding:13px 16px;
      border:1px solid var(--q-line,#ddd); border-radius:10px; background:transparent; color:inherit; }
    .qz-opt:hover:not(:disabled) { border-color:var(--q-accent,#111); }
    .qz-opt:disabled { cursor:default; }
    .qz-opt.right { border-color:#22a45d; background:rgba(34,164,93,.16); font-weight:600; }
    .qz-opt.wrong { border-color:#e0574a; background:rgba(224,87,74,.14); }
    .qz-next { font:inherit; font-size:15px; cursor:pointer; margin-top:20px; padding:11px 22px;
      border-radius:100px; border:none; background:var(--q-accent,#111); color:var(--q-onaccent,#fff); }
    .qz-said { margin-top:16px; font-size:16px; opacity:.8; cursor:pointer; }
    .qz-score { font-size:40px; font-weight:600; margin:10px 0 6px; }
  `;
  document.head.appendChild(qzStyle);

  const qzBtn = document.createElement('button');
  qzBtn.id = 'qzOpen'; qzBtn.type = 'button'; qzBtn.hidden = true;
  qzBtn.textContent = 'Practise these words';
  sel.parentElement.appendChild(qzBtn);

  const qz = document.createElement('div');
  qz.id = 'qz'; qz.hidden = true;
  qz.innerHTML = '<div class="qz-box"><div class="qz-top"><span id="qzProg"></span>'
    + '<button class="qz-x" id="qzX" type="button" aria-label="Close">&times;</button></div>'
    + '<div id="qzBody"></div></div>';
  document.body.appendChild(qz);
  const qzBody = document.getElementById('qzBody'), qzProg = document.getElementById('qzProg');

  const qzItems = d => (DATA[d] || []).filter(it => it.q);
  function syncPractise(d){ qzBtn.hidden = qzItems(d).length < 3; }
  sel.addEventListener('change', () => syncPractise(sel.value));
  setTimeout(() => syncPractise(sel.value), 0);

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  let qzQs = [], qzAt = 0, qzScore = 0, qzRecent = [];

  /* Options are shuffled per question, and a position is rejected if it would make a
     run of three identical correct slots. Kids read the pattern, not the question. */
  function qzOptions(correct, pool){
    const bag = shuffle(pool.filter(w => w !== correct)).slice(0, 3);
    let opts, at, tries = 0;
    do {
      opts = shuffle([correct, ...bag]);
      at = opts.indexOf(correct);
      tries++;
    } while (tries < 15 && qzRecent.length >= 2 &&
             qzRecent[qzRecent.length-1] === at && qzRecent[qzRecent.length-2] === at);
    qzRecent.push(at);
    return opts;
  }

  function qzStart(){
    const items = qzItems(sel.value);
    /* qa = the form the word takes in THIS sentence ("to flirt" on the card,
       "flirt" after "did not"). Falls back to the dictionary form. */
    const pool = items.map(it => it.qa || it.w);
    qzQs = shuffle(items.slice()).map(it => ({ it, opts: qzOptions(it.qa || it.w, pool) }));
    qzAt = 0; qzScore = 0;
    qz.hidden = false;
    qzShow();
  }

  function qzShow(){
    if (qzAt >= qzQs.length) return qzEnd();
    const { it, opts } = qzQs[qzAt];
    qzProg.textContent = (qzAt + 1) + ' / ' + qzQs.length;
    const sentence = esc(it.q).split('___').join('<span class="qz-gap">?</span>');
    qzBody.innerHTML = '<div class="qz-q">' + sentence + '</div><div class="qz-opts"></div>';
    const box = qzBody.querySelector('.qz-opts');
    opts.forEach(w => {
      const b = document.createElement('button');
      b.className = 'qz-opt'; b.type = 'button'; b.textContent = w;
      b.onclick = () => qzAnswer(b, w, it);
      box.appendChild(b);
    });
  }

  function qzAnswer(btn, chosen, it){
    const ans = it.qa || it.w;
    const right = chosen === ans;
    if (right) qzScore++;
    qzBody.querySelectorAll('.qz-opt').forEach(b => {
      b.disabled = true;
      if (b.textContent === ans) b.classList.add('right');
      else if (b === btn) b.classList.add('wrong');
    });
    // show the finished sentence and read it aloud, so the phrase is heard in context
    const full = it.q.split('___').join(ans);
    qzBody.querySelector('.qz-q').innerHTML = esc(full).replace(esc(ans),
      '<span style="font-weight:600;border-bottom:2.5px solid var(--q-accent,#111)">' + esc(ans) + '</span>');
    const said = document.createElement('div');
    said.className = 'qz-said';
    // when the sentence used an inflected form, remind them of the dictionary form
    said.textContent = (it.qa ? it.w + ' — ' : '') + (it.g ? it.g + '  ' : '') + '🔊';
    /* NEVER speak on its own here. Dasha, 2026-08-25: the finished sentence must be
       read ONLY when the pupil asks for it by tapping 🔊 — an automatic voice fires
       while she is still talking in the lesson. */
    said.onclick = () => speak(full);
    qzBody.appendChild(said);
    const next = document.createElement('button');
    next.className = 'qz-next'; next.type = 'button';
    next.textContent = qzAt + 1 >= qzQs.length ? 'See result' : 'Next';
    next.onclick = () => { qzAt++; qzShow(); };
    qzBody.appendChild(next);
    next.focus();
  }

  function qzEnd(){
    qzProg.textContent = 'Done';
    qzBody.innerHTML = '<div class="qz-score">' + qzScore + ' / ' + qzQs.length + '</div>'
      + '<div style="opacity:.75">' + (qzScore === qzQs.length ? 'Every one right.'
        : qzScore * 2 >= qzQs.length ? 'Good going. Try the ones you missed again.'
        : 'Worth another run through these.') + '</div>';
    const again = document.createElement('button');
    again.className = 'qz-next'; again.type = 'button'; again.textContent = 'Try again';
    again.onclick = qzStart;
    qzBody.appendChild(again);
  }

  function qzClose(){ qz.hidden = true; if('speechSynthesis' in window) speechSynthesis.cancel(); }
  qzBtn.onclick = qzStart;
  document.getElementById('qzX').onclick = qzClose;
  qz.addEventListener('click', e => { if (e.target === qz) qzClose(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !qz.hidden) qzClose(); });

function render(date){
 grid.innerHTML='';
 const items=DATA[date]||[];
 items.forEach((it,i)=>{
  const card=document.createElement('article');card.className='card';
  const num=document.createElement('span');num.className='number';num.textContent=String(i+1).padStart(2,'0');num.setAttribute('aria-hidden','true');card.appendChild(num);
  const content=document.createElement('div');
  const word=document.createElement('button');word.className='word';word.type='button';word.setAttribute('aria-label','Listen: '+it.w);
  const label=document.createElement('span');label.textContent=it.w;word.appendChild(label);
  word.insertAdjacentHTML('beforeend','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>');
  word.onclick=()=>speak(it.w);content.appendChild(word);card.appendChild(content);
  if(it.g){
   const gl=document.createElement('p');gl.className='gloss';gl.id='meaning-'+i;gl.hidden=true;gl.dir=GLOSS_DIR;gl.textContent=it.g;content.appendChild(gl);
   const b=document.createElement('button');b.className='reveal';b.type='button';b.textContent=GLOSS_LABEL;b.setAttribute('aria-controls',gl.id);b.setAttribute('aria-expanded','false');
   b.onclick=()=>{gl.hidden=!gl.hidden;b.setAttribute('aria-expanded',String(!gl.hidden));};card.appendChild(b);
  }
  grid.appendChild(card);
 });
 document.getElementById('wordCount').textContent=items.length+' words & phrases';
 if(!items.length)grid.textContent='No words yet.';
}
sel.onchange=()=>render(sel.value);
if(DATES.length){sel.value=DATES[0];render(DATES[0]);}
</script>
</body>
</html>
