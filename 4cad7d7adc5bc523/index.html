<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiyan — words we learned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Brainfish (Admin/Design Styles/DESIGN brainfish.md): white canvas, single lime accent,
     1px black borders, hard offset shadows with ZERO blur, pill buttons, pastel sticker cards.
     Satoshi is not a web font here, so its documented substitute Inter is used. */
  :root{
    --lime:#a3e635; --ink:#000; --paper:#fff; --shadow:rgb(10,10,13);
    --steel:#737373; --fog:#f5f5f5; --graphite:#171717;
    --butter:#fef3c8; --mint:#d2fae5; --lilac:#fae9ff; --bubble:#f5d1fe; --sky:#b7eaf6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:Inter,'DM Sans','Segoe UI',system-ui,sans-serif; font-weight:500;
    color:var(--ink); background:var(--paper); padding:24px 16px 64px;
    letter-spacing:-0.096px; font-feature-settings:"ss01" on,"cv11" on;
  }
  .wrap{ max-width:1200px; margin:0 auto; }
  .hero{
    background:var(--sky); border:1px solid var(--ink); border-radius:20px;
    padding:28px 24px; margin-bottom:24px;
    box-shadow:4px 4px 0 0 rgb(23,23,23);
  }
  .eyebrow{
    display:inline-block; background:var(--paper); border:1px solid var(--ink);
    border-radius:100px; padding:6px 14px; font-size:14px; font-weight:500;
    letter-spacing:-0.14px; margin-bottom:12px;
  }
  h1{ font-size:32px; font-weight:700; letter-spacing:-0.32px; line-height:1.33; }
  .sub{ font-size:16px; font-weight:500; line-height:1.5; margin-top:8px; letter-spacing:-0.096px; }
  .bar{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:24px; }
  select{
    font:inherit; font-weight:500; font-size:16px; padding:10px 14px;
    background:var(--paper); color:var(--ink);
    border:1px solid var(--ink); border-radius:100px;
    box-shadow:2px 2px 0 0 var(--shadow); cursor:pointer;
  }
  .score{
    background:var(--lime); border:1px solid var(--ink); border-radius:8px;
    padding:10px 16px; font-size:16px; font-weight:700; letter-spacing:-0.096px;
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card{
    background:var(--paper); border:1px solid var(--ink); border-radius:16px;
    padding:24px; box-shadow:4px 4px 0 0 rgb(23,23,23);
  }
  .card.ok{ background:var(--mint); }
  .card.bad{ background:var(--butter); }
  .crow{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .num{ font-size:14px; font-weight:700; letter-spacing:-0.14px; }
  /* Ghost outlined button = secondary action */
  .listen{
    background:var(--paper); border:1px solid var(--ink); border-radius:100px;
    padding:10px 20px; font:inherit; font-weight:500; font-size:16px; color:var(--ink);
    box-shadow:2px 2px 0 0 var(--shadow); cursor:pointer; letter-spacing:-0.096px;
  }
  .mask{
    font-family:'Courier New',monospace; font-size:22px; letter-spacing:6px;
    color:var(--steel); margin-bottom:16px; min-height:28px; word-break:break-all;
  }
  .mask.shown{ color:var(--ink); font-weight:700; letter-spacing:1px; font-family:inherit; }
  /* Input field: 4px radius, black border, focus adds the hard shadow */
  input.ans{
    width:100%; font:inherit; font-weight:500; font-size:16px; padding:10px 14px;
    background:var(--paper); color:var(--ink);
    border:1px solid var(--ink); border-radius:4px; letter-spacing:-0.096px;
  }
  input.ans::placeholder{ color:var(--steel); }
  input.ans:focus{ outline:2px solid transparent; outline-offset:2px; box-shadow:2px 2px 0 0 var(--shadow); }
  .btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  button.act{
    border:1px solid var(--ink); border-radius:100px; padding:10px 20px;
    font:inherit; font-weight:500; font-size:16px; color:var(--ink);
    box-shadow:2px 2px 0 0 var(--shadow); cursor:pointer; letter-spacing:-0.096px;
  }
  .check{ background:var(--lime); }          /* lime CTA = primary action */
  .hintb{ background:var(--paper); }
  .showb{ background:var(--paper); }
  /* Pastel sticker info-card for the chunk hint */
  .hint{
    margin-top:16px; background:var(--lilac); border:1px solid var(--ink);
    border-radius:12px; padding:16px; font-size:16px; font-weight:500; line-height:1.5;
    box-shadow:2px 2px 0 0 var(--shadow); letter-spacing:-0.096px;
  }
  .hidden{ display:none; }
  .verdict{ margin-top:12px; font-size:16px; font-weight:700; letter-spacing:-0.096px; }
  footer{ text-align:center; color:var(--steel); font-size:14px; margin-top:40px; letter-spacing:-0.14px; }
  @media (max-width:420px){ h1{ font-size:24px; letter-spacing:-0.216px; } .hero{ padding:20px 18px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="eyebrow">Spelling practice</span>
    <h1>Kiyan</h1>
    <div class="sub">Listen, type the word, then check it. Tap Chunks if you get stuck.</div>
  </div>
  <div class="bar">
    <select id="dateSel"></select>
    <div class="score" id="score">0 / 0 correct</div>
  </div>
  <div class="grid" id="grid"></div>
  <footer>Tap the sound button as many times as you like.</footer>
</div>
<script>
  const DATA = {"2026-07-30": [{"w": "documentary", "g": "docu · ment · ary · the word \"document\" is hiding inside it", "e": ""}, {"w": "ferocious", "g": "fero · cious · one r, and it ends like \"delicious\"", "e": ""}, {"w": "predators", "g": "pre · da · tors · \"pre\" like in predict", "e": ""}, {"w": "dangerous", "g": "danger · ous · the word \"danger\" plus ous", "e": ""}, {"w": "friend", "g": "fri · end · a friend to the end", "e": ""}, {"w": "their cubs", "g": "the · ir · \"their\" means belonging to them: their cubs, their den", "e": ""}, {"w": "doesn't", "g": "does + not · the apostrophe stands in for the o", "e": ""}]}, DATES = ["2026-07-30"], ACC = ["#ff6b6b", "#20b3a2", "#f4a534", "#9b5de5", "#3ab34a", "#ff5da2", "#4d96ff", "#e5643e"];
  const GLOSS_LABEL = "перевод", GLOSS_DIR = "ltr";

  const sel = document.getElementById('dateSel'), grid = document.getElementById('grid');
  /* Show dates as "29 July 2026" but keep the ISO string as the option value (the DATA key). */
  const _MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fmtDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m ? (+m[3])+' '+_MONTHS[+m[2]-1]+' '+m[1] : iso; }
  DATES.forEach(d => { const o=document.createElement('option'); o.value=d; o.textContent=fmtDate(d); sel.appendChild(o); });

  /* Voice locked to Google UK English Female (same as Space Lotto / Dino Squad) */
  let vcVoice = null;
  function vcLoad(){
    const vs = speechSynthesis.getVoices();
    vcVoice =
      vs.find(v => v.name === 'Google UK English Female') ||
      vs.find(v => /google/i.test(v.name) && /en-GB/i.test(v.lang)) ||
      vs.find(v => /en-GB/i.test(v.lang) && /female|samantha|kate|serena|stephanie/i.test(v.name)) ||
      vs.find(v => /en-GB/i.test(v.lang)) ||
      vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){ vcLoad(); speechSynthesis.onvoiceschanged = vcLoad; }
  function speak(t){ if(!('speechSynthesis'in window))return; const u=new SpeechSynthesisUtterance(t);
    u.lang = vcVoice ? vcVoice.lang : 'en-GB'; u.rate=.9; u.pitch=1.0; if(vcVoice) u.voice=vcVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u); }
  function isImg(e){ return /^(https?:|data:)/i.test(e) || /\.(png|jpe?g|svg|webp|gif)(\?|$)/i.test(e); }

  /* Straight vs curly apostrophes must not count as a spelling mistake. */
  function norm(s){ return (s||'').toLowerCase().trim()
      .replace(/[‘’ʼ]/g,"'").replace(/\s+/g,' '); }
  /* Mask every character, including the apostrophe: WHERE it goes is exactly
     what he gets wrong, so it must not be printed for him. Spaces stay visible
     so multi-word items still read as several words. */
  function maskOf(w){ return w.replace(/\S/g,'•').replace(/ /g,'  '); }

  let done = {};
  function updateScore(date){
    const total=(DATA[date]||[]).length;
    const ok=Object.values(done).filter(Boolean).length;
    document.getElementById('score').textContent = ok+' / '+total+' correct';
  }
  function render(date){
    grid.innerHTML=''; done={};
    (DATA[date]||[]).forEach((it,i)=>{
      const card=document.createElement('div'); card.className='card';

      const top=document.createElement('div'); top.className='crow';
      const n=document.createElement('span'); n.className='num';
      n.textContent=String(i+1).padStart(2,'0');
      const lb=document.createElement('button'); lb.className='listen';
      lb.textContent='▶ Listen'; lb.onclick=()=>speak(it.w);
      top.appendChild(n); top.appendChild(lb); card.appendChild(top);

      const mask=document.createElement('div'); mask.className='mask';
      mask.textContent=maskOf(it.w); card.appendChild(mask);

      const inp=document.createElement('input'); inp.className='ans'; inp.type='text';
      inp.autocapitalize='off'; inp.autocomplete='off'; inp.spellcheck=false;
      inp.setAttribute('aria-label','type the word');
      card.appendChild(inp);

      let shown=false;
      const v=document.createElement('div'); v.className='verdict hidden'; 
      const btns=document.createElement('div'); btns.className='btns';

      const cb=document.createElement('button'); cb.className='act check'; cb.textContent='Check';
      const hint=document.createElement('div'); hint.className='hint hidden';
      if(it.g) hint.textContent=it.g;

      function doCheck(){
        const good = norm(inp.value)===norm(it.w);
        v.classList.remove('hidden');
        card.classList.toggle('ok',good); card.classList.toggle('bad',!good);
        v.classList.toggle('ok',good); v.classList.toggle('bad',!good);
        v.textContent = good ? '✓ Correct' : '✗ Not yet, try again';
        done[i]=good; updateScore(date);
      }
      cb.onclick=doCheck;
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter') doCheck(); });
      /* The chunks joined together spell the word, so they must not be readable WHILE he
         writes: that turns the task into copying. Looking is fine, copying is not, so any
         reveal closes as soon as he types. This is the "cover" step of look-cover-write. */
      inp.addEventListener('input',()=>{
        if(!hint.classList.contains('hidden')) hint.classList.add('hidden');
        if(shown){ shown=false; mask.textContent=maskOf(it.w);
                   mask.classList.remove('shown'); sb.textContent='Show me'; }
      });
      btns.appendChild(cb);

      if(it.g){
        const hb=document.createElement('button'); hb.className='act hintb'; hb.textContent='Chunks';
        hb.onclick=()=>hint.classList.toggle('hidden');
        btns.appendChild(hb);
      }
      /* Show/Hide must be a TOGGLE: after peeking he needs to hide the word again and
         have another go (Dasha, 2026-07-30). Hiding also clears his previous attempt so
         the retry is genuine, and un-counts the card until he gets it right again. */
      const sb=document.createElement('button'); sb.className='act showb'; sb.textContent='Show me';
      sb.onclick=()=>{
        shown=!shown;
        if(shown){
          mask.textContent=it.w; mask.classList.add('shown'); sb.textContent='Hide';
        } else {
          mask.textContent=maskOf(it.w); mask.classList.remove('shown'); sb.textContent='Show me';
          inp.value=''; v.classList.add('hidden');
          card.classList.remove('ok','bad');
          delete done[i]; updateScore(date);
          inp.focus();
        }
      };
      btns.appendChild(sb);

      card.appendChild(btns);
      if(it.g) card.appendChild(hint);
      card.appendChild(v);
      grid.appendChild(card);
    });
    updateScore(date);
  }
  sel.onchange=()=>render(sel.value);
  if(DATES.length) render(DATES[0]);
</script>
</body>
</html>
