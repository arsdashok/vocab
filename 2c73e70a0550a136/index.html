<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maksim — words we learned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* GSAP style — neon playground in midnight void (Admin/Design Styles/DESIGN gsap.md) */
  :root { --void:#0e100f; --cream:#fffce1; --olive:#42433d; --ash:#7c7c6f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Inter Tight',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--void); color:var(--cream); letter-spacing:-0.01em;
    padding:40px 24px 64px; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1100px; margin:0 auto; }
  .tag { font-size:14px; color:var(--cream); opacity:.85; margin-bottom:16px; }
  .top {
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:20px; margin-bottom:18px;
  }
  h1 { font-size:clamp(38px,8vw,72px); font-weight:400; line-height:.95;
       letter-spacing:-0.03em; color:var(--cream); }
  .datepill { display:flex; align-items:center; gap:10px; font-size:15px; color:var(--cream); }
  #dateSel {
    font:inherit; font-size:15px; color:var(--cream); background:transparent;
    border:1px solid var(--cream); border-radius:100px; padding:9px 18px; cursor:pointer;
    letter-spacing:-0.01em;
  }
  #dateSel option { background:var(--void); color:var(--cream); }
  .hint { font-size:16px; color:var(--ash); margin-bottom:26px; }
  .rule { height:1px; background:var(--olive); width:100%; margin-bottom:32px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .card {
    background:var(--void); border:1px solid var(--olive); border-radius:8px;
    padding:20px 22px; display:flex; flex-direction:column; align-items:flex-start;
    gap:12px; min-height:120px;
  }
  .crow { display:flex; align-items:center; justify-content:space-between; width:100%; gap:10px; }
  .meta { font-size:14px; }
  .ctl-group { display:flex; align-items:center; gap:8px; }  /* matched controls, top-right */
  .ctl {
    width:32px; height:32px; border-radius:100px; border:1px solid var(--olive);
    background:transparent; color:var(--racc); cursor:pointer; padding:0;
    display:inline-flex; align-items:center; justify-content:center; transition:.15s;
  }
  .ctl svg { width:17px; height:17px; display:block; }
  .ctl:hover { border-color:var(--racc); }
  .ctl.open { background:var(--racc); color:var(--void); border-color:var(--racc); }
  .pic { font-size:34px; line-height:1; }
  .picimg { width:46px; height:46px; object-fit:contain; display:block; }
  .word {
    font-size:23px; font-weight:500; line-height:1.15; letter-spacing:-0.015em;
    cursor:pointer; user-select:none;
  }
  .word:active { opacity:.6; }
  .gloss { font-size:16px; color:var(--cream); line-height:1.35; }
  .gloss[dir="rtl"] { text-align:right; }
  .gloss.hidden { display:none; }
  footer { color:var(--ash); font-size:13px; margin-top:44px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">{ vocab review }</div>
    <div class="top">
      <h1>Words we learned</h1>
      <div class="datepill"><span>Lesson</span><select id="dateSel"></select></div>
    </div>
    <p class="hint">Tap a word to hear it &nbsp;·&nbsp; tap the eye for the translation</p>
    <div class="rule"></div>
    <div id="grid"></div>
    <footer>{ Maksim · vocab review }</footer>
  </div>
<script>
  const DATA = {"2026-08-02": [{"w": "a jug", "g": "кувшин", "e": ""}, {"w": "your daily intake", "g": "ваше суточное потребление", "e": ""}, {"w": "at least half of it", "g": "как минимум половина", "e": ""}, {"w": "fizzy drinks", "g": "газированные напитки", "e": ""}, {"w": "artificial sweeteners", "g": "искусственные подсластители", "e": ""}, {"w": "she mentioned it", "g": "она это упомянула", "e": ""}, {"w": "they confuse it with steroids", "g": "они путают это со стероидами", "e": ""}, {"w": "it is controversial", "g": "это спорный вопрос", "e": ""}, {"w": "steer clear of it", "g": "держаться от этого подальше", "e": ""}, {"w": "according to some studies", "g": "согласно некоторым исследованиям", "e": ""}, {"w": "it contradicts last week's research", "g": "это противоречит исследованию прошлой недели", "e": ""}, {"w": "it can cut the risk of a heart attack", "g": "это может снизить риск инфаркта", "e": ""}, {"w": "liver disease", "g": "болезнь печени", "e": ""}, {"w": "high blood pressure", "g": "высокое давление", "e": ""}, {"w": "it can cause heart disease", "g": "это может вызвать болезнь сердца", "e": ""}, {"w": "especially for middle-aged men", "g": "особенно для мужчин среднего возраста", "e": ""}, {"w": "the tea leaves were soaked in juice", "g": "чайные листья пропитали соком", "e": ""}, {"w": "Have you got it?", "g": "есть ли у вас это?", "e": ""}, {"w": "last year", "g": "в прошлом году", "e": ""}], "2026-08-01": [{"w": "I can get the keys on Monday", "g": "я могу забрать ключи в понедельник", "e": ""}, {"w": "He can't give us the keys", "g": "он не может отдать нам ключи", "e": ""}, {"w": "Give her the bag", "g": "дай ей сумку", "e": ""}, {"w": "It's not going according to the plan", "g": "всё идёт не по плану", "e": ""}, {"w": "not at all", "g": "совсем нет, вообще нет", "e": ""}, {"w": "probably", "g": "наверное, вероятно", "e": ""}, {"w": "riverbank", "g": "берег реки", "e": ""}, {"w": "the shore", "g": "берег моря", "e": ""}, {"w": "a block of flats", "g": "многоквартирный дом", "e": ""}, {"w": "a house for one family", "g": "частный дом на одну семью", "e": ""}, {"w": "an embassy", "g": "посольство", "e": ""}, {"w": "a mansion", "g": "особняк", "e": ""}, {"w": "the outskirts", "g": "окраина", "e": ""}, {"w": "We would like to move somewhere calmer", "g": "мы хотели бы переехать куда-нибудь поспокойнее", "e": ""}, {"w": "to have a peek", "g": "заглянуть одним глазком", "e": ""}, {"w": "well looked-after houses", "g": "ухоженные дома", "e": ""}, {"w": "How long did it take you to walk 25 kilometres?", "g": "сколько времени у вас заняло пройти 25 километров?", "e": ""}], "2026-07-30": [{"w": "a drought", "g": "засуха", "e": ""}, {"w": "a hosepipe ban", "g": "запрет на полив из шланга", "e": ""}, {"w": "an outbreak", "g": "вспышка, о болезни", "e": ""}, {"w": "measles", "g": "корь", "e": ""}, {"w": "furnished", "g": "с мебелью", "e": ""}, {"w": "kitchen appliances", "g": "кухонная техника", "e": ""}, {"w": "a wardrobe", "g": "шкаф для одежды", "e": ""}, {"w": "a van", "g": "фургон", "e": ""}, {"w": "a truck", "g": "грузовик", "e": ""}, {"w": "nearby", "g": "поблизости, рядом", "e": ""}, {"w": "quiet", "g": "тихий", "e": ""}, {"w": "quite", "g": "довольно, достаточно", "e": ""}, {"w": "greenery", "g": "зелень, зелёные насаждения", "e": ""}, {"w": "the bank of the Danube", "g": "берег Дуная", "e": ""}, {"w": "I don't know if the flat is ready", "g": "я не знаю, готова ли квартира", "e": ""}, {"w": "What I like best about my city is how green it is", "g": "больше всего мне нравится в моём городе то, какой он зелёный", "e": ""}], "2026-07-26": [{"w": "in a week", "g": "через неделю", "e": ""}, {"w": "my belongings", "g": "мои вещи, всё что мне принадлежит", "e": ""}, {"w": "to pack", "g": "упаковать / распаковать", "e": ""}, {"w": "they will do it by themselves", "g": "они сделают это сами", "e": ""}, {"w": "I don't know if they will unpack", "g": "я не знаю, распакуют ли они", "e": ""}, {"w": "Is it furnished or unfurnished?", "g": "она с мебелью или без?", "e": ""}, {"w": "a wardrobe", "g": "шкаф для одежды", "e": ""}, {"w": "kitchen appliances", "g": "кухонная техника", "e": ""}, {"w": "a dishwasher", "g": "посудомоечная машина", "e": ""}, {"w": "a washing machine", "g": "стиральная машина", "e": ""}, {"w": "a fridge", "g": "холодильник", "e": ""}, {"w": "an air conditioner, an AC", "g": "кондиционер", "e": ""}, {"w": "something else", "g": "что-то ещё", "e": ""}, {"w": "further than our current flat", "g": "дальше, чем наша нынешняя квартира", "e": ""}, {"w": "a one-year term", "g": "срок на один год", "e": ""}, {"w": "a contrasting city", "g": "город контрастов", "e": ""}, {"w": "the bank of a river", "g": "берег реки", "e": ""}, {"w": "he broke his arm", "g": "он сломал руку", "e": ""}, {"w": "she twisted her ankle", "g": "она подвернула лодыжку", "e": ""}, {"w": "his leg hurts", "g": "у него болит нога", "e": ""}]}, DATES = ["2026-08-02", "2026-08-01", "2026-07-30", "2026-07-26"];
  const GLOSS_LABEL = "перевод", GLOSS_DIR = "ltr";
  const ACC = ["#0ae448", "#fec5fb", "#ff8709", "#9d95ff", "#00bae2", "#abff84"];

  const sel = document.getElementById('dateSel'), grid = document.getElementById('grid');
  /* Show dates as "29 July 2026" but keep the ISO string as the option value (the DATA key). */
  const _MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fmtDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m ? (+m[3])+' '+_MONTHS[+m[2]-1]+' '+m[1] : iso; }
  DATES.forEach(d => { const o=document.createElement('option'); o.value=d; o.textContent=fmtDate(d); sel.appendChild(o); });

  /* Voice locked to Google UK English Female (same as Space Lotto / Dino Squad) */
  let vcVoice = null;
  function vcLoad(){
    const vs = speechSynthesis.getVoices();
    vcVoice =
      vs.find(v => v.name === 'Google UK English Female') ||
      vs.find(v => /google/i.test(v.name) && /en-GB/i.test(v.lang)) ||
      vs.find(v => /en-GB/i.test(v.lang) && /female|samantha|kate|serena|stephanie/i.test(v.name)) ||
      vs.find(v => /en-GB/i.test(v.lang)) ||
      vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){ vcLoad(); speechSynthesis.onvoiceschanged = vcLoad; }
  function speak(t){ if(!('speechSynthesis'in window))return; const u=new SpeechSynthesisUtterance(t);
    u.lang = vcVoice ? vcVoice.lang : 'en-GB'; u.rate=.9; u.pitch=1.0; if(vcVoice) u.voice=vcVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u); }
  function isImg(e){ return /^(https?:|data:)/i.test(e) || /\.(png|jpe?g|svg|webp|gif)(\?|$)/i.test(e); }

  const SPK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.8 6a8 8 0 0 1 0 12"/></svg>`;
  const EYE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
  function render(date){
    grid.innerHTML='';
    (DATA[date]||[]).forEach((it,i)=>{
      const acc = ACC[i % ACC.length];
      const card=document.createElement('div'); card.className='card';
      card.style.borderColor = acc; card.style.setProperty('--racc', acc);

      const top=document.createElement('div'); top.className='crow';
      const meta=document.createElement('div'); meta.className='meta';
      meta.textContent = '{ '+String(i+1).padStart(2,'0')+' }'; meta.style.color = acc;
      top.appendChild(meta);

      const grp=document.createElement('div'); grp.className='ctl-group';
      const spk=document.createElement('button'); spk.className='ctl'; spk.title='listen';
      spk.setAttribute('aria-label','listen'); spk.innerHTML=SPK_SVG; spk.onclick=()=>speak(it.w);
      grp.appendChild(spk);
      top.appendChild(grp);
      card.appendChild(top);

      if(it.e){
        const pic=document.createElement('div'); pic.className='pic';
        if(isImg(it.e)){ const im=document.createElement('img'); im.className='picimg'; im.src=it.e; im.alt=''; pic.appendChild(im); }
        else { pic.textContent=it.e; }
        card.appendChild(pic);
      }

      const w=document.createElement('div'); w.className='word'; w.style.color=acc;
      w.textContent=it.w; w.onclick=()=>speak(it.w);
      card.appendChild(w);

      if(it.g){
        const gl=document.createElement('div'); gl.className='gloss hidden'; gl.textContent=it.g;
        card.appendChild(gl);
        const rev=document.createElement('button'); rev.className='ctl'; rev.title=GLOSS_LABEL;
        rev.setAttribute('aria-label',GLOSS_LABEL); rev.innerHTML=EYE_SVG;
        rev.onclick=()=>{ gl.classList.toggle('hidden'); rev.classList.toggle('open'); };
        grp.appendChild(rev);
      }
      grid.appendChild(card);
    });
  }
  sel.onchange=()=>render(sel.value);
  if(DATES.length){ sel.value=DATES[0]; render(DATES[0]); }
  else grid.innerHTML='<p style="color:var(--ash)">No words yet.</p>';
</script>
</body>
</html>
