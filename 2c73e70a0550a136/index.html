<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maksim — words we learned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* GSAP style — neon playground in midnight void (Admin/Design Styles/DESIGN gsap.md) */
  :root { --void:#0e100f; --cream:#fffce1; --olive:#42433d; --ash:#7c7c6f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Inter Tight',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--void); color:var(--cream); letter-spacing:-0.01em;
    padding:40px 24px 64px; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1100px; margin:0 auto; }
  .tag { font-size:14px; color:var(--cream); opacity:.85; margin-bottom:16px; }
  .top {
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:20px; margin-bottom:18px;
  }
  h1 { font-size:clamp(38px,8vw,72px); font-weight:400; line-height:.95;
       letter-spacing:-0.03em; color:var(--cream); }
  .datepill { display:flex; align-items:center; gap:10px; font-size:15px; color:var(--cream); }
  #dateSel {
    font:inherit; font-size:15px; color:var(--cream); background:transparent;
    border:1px solid var(--cream); border-radius:100px; padding:9px 18px; cursor:pointer;
    letter-spacing:-0.01em;
  }
  #dateSel option { background:var(--void); color:var(--cream); }
  .hint { font-size:16px; color:var(--ash); margin-bottom:26px; }
  .rule { height:1px; background:var(--olive); width:100%; margin-bottom:32px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .card {
    background:var(--void); border:1px solid var(--olive); border-radius:8px;
    padding:22px 22px 20px; display:flex; flex-direction:column; align-items:flex-start;
    gap:14px; min-height:158px;
  }
  .meta { font-size:14px; }
  .pic { font-size:34px; line-height:1; }
  .picimg { width:46px; height:46px; object-fit:contain; display:block; }
  .word {
    font-size:23px; font-weight:500; line-height:1.15; letter-spacing:-0.015em;
    cursor:pointer; user-select:none;
  }
  .word:active { opacity:.6; }
  .word .spk { font-size:15px; opacity:.55; }
  .gloss { font-size:16px; color:var(--cream); line-height:1.35; }
  .gloss.hidden { display:none; }
  .reveal {
    margin-top:auto; font:inherit; font-size:14px; font-weight:400; color:var(--cream);
    background:transparent; border:1px solid var(--cream); border-radius:100px;
    padding:8px 18px; cursor:pointer; letter-spacing:-0.01em; transition:opacity .15s;
  }
  .reveal:hover { opacity:.65; }
  .reveal.open { border-color:var(--olive); color:var(--ash); }
  footer { color:var(--ash); font-size:13px; margin-top:44px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">{ vocab review }</div>
    <div class="top">
      <h1>Words we learned</h1>
      <div class="datepill"><span>Lesson</span><select id="dateSel"></select></div>
    </div>
    <p class="hint">Tap a word to hear it 🔊 &nbsp;·&nbsp; tap «перевод» to check the meaning</p>
    <div class="rule"></div>
    <div id="grid"></div>
    <footer>{ Maksim · vocab review }</footer>
  </div>
<script>
  const DATA = {"2026-07-26": [{"w": "in a week", "g": "через неделю", "e": ""}, {"w": "my belongings", "g": "мои вещи, всё что мне принадлежит", "e": ""}, {"w": "to pack", "g": "упаковать / распаковать", "e": ""}, {"w": "they will do it by themselves", "g": "они сделают это сами", "e": ""}, {"w": "I don't know if they will unpack", "g": "я не знаю, распакуют ли они", "e": ""}, {"w": "Is it furnished or unfurnished?", "g": "она с мебелью или без?", "e": ""}, {"w": "a wardrobe", "g": "шкаф для одежды", "e": ""}, {"w": "kitchen appliances", "g": "кухонная техника", "e": ""}, {"w": "a dishwasher", "g": "посудомоечная машина", "e": ""}, {"w": "a washing machine", "g": "стиральная машина", "e": ""}, {"w": "a fridge", "g": "холодильник", "e": ""}, {"w": "an air conditioner, an AC", "g": "кондиционер", "e": ""}, {"w": "something else", "g": "что-то ещё", "e": ""}, {"w": "further than our current flat", "g": "дальше, чем наша нынешняя квартира", "e": ""}, {"w": "a one-year term", "g": "срок на один год", "e": ""}, {"w": "a contrasting city", "g": "город контрастов", "e": ""}, {"w": "the bank of a river", "g": "берег реки", "e": ""}, {"w": "he broke his arm", "g": "он сломал руку", "e": ""}, {"w": "she twisted her ankle", "g": "она подвернула лодыжку", "e": ""}, {"w": "his leg hurts", "g": "у него болит нога", "e": ""}]}, DATES = ["2026-07-26"];
  const ACC = ["#0ae448", "#fec5fb", "#ff8709", "#9d95ff", "#00bae2", "#abff84"];

  const sel = document.getElementById('dateSel'), grid = document.getElementById('grid');
  DATES.forEach(d => { const o=document.createElement('option'); o.value=o.textContent=d; sel.appendChild(o); });

  /* Voice locked to Google UK English Female (same as Space Lotto / Dino Squad) */
  let vcVoice = null;
  function vcLoad(){
    const vs = speechSynthesis.getVoices();
    vcVoice =
      vs.find(v => v.name === 'Google UK English Female') ||
      vs.find(v => /google/i.test(v.name) && /en-GB/i.test(v.lang)) ||
      vs.find(v => /en-GB/i.test(v.lang) && /female|samantha|kate|serena|stephanie/i.test(v.name)) ||
      vs.find(v => /en-GB/i.test(v.lang)) ||
      vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){ vcLoad(); speechSynthesis.onvoiceschanged = vcLoad; }
  function speak(t){ if(!('speechSynthesis'in window))return; const u=new SpeechSynthesisUtterance(t);
    u.lang = vcVoice ? vcVoice.lang : 'en-GB'; u.rate=.9; u.pitch=1.0; if(vcVoice) u.voice=vcVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u); }
  function isImg(e){ return /^(https?:|data:)/i.test(e) || /\.(png|jpe?g|svg|webp|gif)(\?|$)/i.test(e); }

  function render(date){
    grid.innerHTML='';
    (DATA[date]||[]).forEach((it,i)=>{
      const acc = ACC[i % ACC.length];
      const card=document.createElement('div'); card.className='card';
      card.style.borderColor = acc;

      const meta=document.createElement('div'); meta.className='meta';
      meta.textContent = '{ '+String(i+1).padStart(2,'0')+' }'; meta.style.color = acc;
      card.appendChild(meta);

      if(it.e){
        const pic=document.createElement('div'); pic.className='pic';
        if(isImg(it.e)){ const im=document.createElement('img'); im.className='picimg'; im.src=it.e; im.alt=''; pic.appendChild(im); }
        else { pic.textContent=it.e; }
        card.appendChild(pic);
      }

      const w=document.createElement('div'); w.className='word'; w.style.color=acc;
      w.innerHTML=it.w+' <span class="spk">🔊</span>'; w.onclick=()=>speak(it.w);
      card.appendChild(w);

      if(it.g){
        const gl=document.createElement('div'); gl.className='gloss hidden'; gl.textContent=it.g;
        card.appendChild(gl);
        const b=document.createElement('button'); b.className='reveal'; b.textContent='перевод';
        b.onclick=()=>{ gl.classList.toggle('hidden'); b.classList.toggle('open'); };
        card.appendChild(b);
      }
      grid.appendChild(card);
    });
  }
  sel.onchange=()=>render(sel.value);
  if(DATES.length){ sel.value=DATES[0]; render(DATES[0]); }
  else grid.innerHTML='<p style="color:var(--ash)">No words yet.</p>';
</script>
</body>
</html>
