<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Баланс уроков</title>
<style>
  :root { --accent: #6c63ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: #f7f6fb; color: #1f2937;
    padding: 20px 14px 40px; line-height: 1.5;
  }
  .wrap { max-width: 620px; margin: 0 auto; }

  header {
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    color: white; border-radius: 14px;
    padding: 18px 22px; margin-bottom: 16px;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { font-size: 13px; opacity: .92; margin-top: 3px; }

  .card {
    background: white; border-radius: 14px;
    padding: 20px 22px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  .big { text-align: center; padding: 28px 22px 24px; }
  .big .left-num { font-size: 62px; line-height: 1; font-weight: 800; color: var(--accent); }
  .big .left-label { font-size: 15px; color: #6b7280; margin-top: 6px; }

  .bar {
    height: 10px; background: #ede9fe; border-radius: 6px;
    overflow: hidden; margin: 24px 0 8px;
  }
  .bar span { display: block; height: 100%; width: 10%; background: var(--accent); border-radius: 6px; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 12.5px; color: #6b7280; }

  .dots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; justify-content: center; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: #ede9fe; border: 1.5px solid #ddd6fe; }
  .dot.used { background: var(--accent); border-color: var(--accent); }
  .dots-cap { font-size: 12px; color: #9ca3af; margin-top: 10px; }

  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
    color: #7c3aed; font-weight: 700; margin-bottom: 12px;
  }

  ul.blocks { list-style: none; font-size: 14px; }
  ul.blocks li {
    padding: 8px 0; border-bottom: 1px solid #f3f0ff;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  ul.blocks li:last-child { border-bottom: none; }
  ul.blocks li span { color: #9ca3af; font-size: 13px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .04em; color: #9ca3af; font-weight: 600;
    padding-bottom: 8px; border-bottom: 1.5px solid #f3f0ff;
  }
  td { padding: 9px 0; border-bottom: 1px solid #f7f6fb; }
  tr:last-child td { border-bottom: none; }
  td.num { width: 34px; color: var(--accent); font-weight: 700; font-size: 13px; }
  td.date { color: #374151; }
  td.who { color: #6b7280; text-align: right; font-size: 13px; }
  td.empty, td.more { color: #9ca3af; text-align: center; padding: 14px 0; font-size: 13px; }

  footer { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 22px; }

  @media (max-width: 420px) {
    .big .left-num { font-size: 52px; }
    body { padding: 14px 10px 30px; }
    .card { padding: 16px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Баланс уроков</h1>
    <div class="sub">Кристина и Милана</div>
  </header>

  <div class="card big">
    <div class="left-num">18</div>
    <div class="left-label">уроков осталось</div>

    <div class="bar"><span></span></div>
    <div class="bar-labels">
      <span>Проведено: 2</span>
      <span>Оплачено: 20</span>
    </div>

    <div class="dots"><span class="dot used"></span><span class="dot used"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    
  </div>

  <div class="card">
    <h2>Оплаченные пакеты</h2>
    <ul class="blocks">
      <li><b>20 уроков</b><span>оплачено 25 августа 2026</span></li>
    </ul>
  </div>

  <div class="card">
    <h2>Проведённые уроки</h2>
    <table>
      <thead>
        <tr><th>№</th><th>Дата</th><th style="text-align:right">Ученик</th></tr>
      </thead>
      <tbody>
        <tr><td class="num">2</td><td class="date">25 августа 2026</td><td class="who">Кристина</td></tr>
<tr><td class="num">1</td><td class="date">25 августа 2026</td><td class="who">Милана</td></tr>
      </tbody>
    </table>
  </div>

  <footer>Обновлено 25 августа 2026</footer>

</div>
</body>
</html>
