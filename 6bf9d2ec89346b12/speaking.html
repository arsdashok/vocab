<style>
/* Speaking Wheel: shared layout. Theme files only set the variables below and add small extras. */
:root{
  --page:#0b1026;
  --title-ink:#fff; --title-shadow:0 2px 0 rgba(0,0,0,.28);
  --card:#ffffff; --card-ink:#1f2937; --card-border:0 solid transparent; --card-shadow:0 22px 60px rgba(15,23,42,.30);
  --radius:28px;
  --accent:#ff6b57; --accent-ink:#fff; --accent2:#0fb5ae;
  --muted:#64748b; --line:rgba(15,23,42,.12);
  --btn:#ff6b57; --btn-ink:#fff; --btn-edge:#c2410c;
  --idea:#f8fafc; --idea-ink:#1f2937; --idea-line:#e2e8f0; --idea-on:#fff1e6; --idea-on-line:var(--accent);
  --chip:#fff7ed; --chip-ink:#9a3412; --chip-line:#fed7aa; --chip-on:var(--accent); --chip-on-ink:#fff;
  --tool:#f1f5f9; --tool-ink:#334155;
  --font-d:'Fredoka',system-ui,sans-serif; --font-b:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-b);color:var(--card-ink);background:var(--page);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}

#stage{position:fixed;inset:0;z-index:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:0}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

/* flat fallback when 3D is not available */
#flat{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#flat[hidden]{display:none}
/* pre-rendered scene (no 3D in this browser): a looping plate, the live wheel face, a rendered rim and pointer */
#flat.lite{display:block;overflow:hidden;cursor:default}
#flat.lite .lv{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;will-change:transform;pointer-events:none;object-fit:fill}
#flat.lite .lface{position:absolute;border-radius:50%;overflow:hidden;cursor:pointer;will-change:transform}
#flat.lite .lface canvas{width:100%;height:100%;display:block;border:0;border-radius:0;box-shadow:none}
#flat.lite .lgloss{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.26),rgba(255,255,255,0) 46%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 64%,rgba(0,0,0,.2) 100%)}
#flat.lite .lframe,#flat.lite .lptr{position:absolute;max-width:none;pointer-events:none;will-change:transform}
#flat .f-wrap{position:relative;width:min(70vh,46vw);aspect-ratio:1}
#flat canvas{width:100%;height:100%;border-radius:50%;border:10px solid #fff;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#flat .f-ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:36px solid var(--btn);z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}

#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 26px;pointer-events:none}
#top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--font-d);font-weight:700;font-size:28px;line-height:1;color:var(--title-ink);text-shadow:var(--title-shadow);background:var(--brand-bg,rgba(10,30,60,.28));padding:8px 18px 8px 12px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand .logo{font-size:36px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.top-tools{display:flex;gap:10px;position:relative}
.pill{font-family:var(--font-d);font-weight:600;font-size:17px;padding:9px 16px;border-radius:999px;border:0;cursor:pointer;background:rgba(255,255,255,.9);color:#1f2937;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.pill:hover{background:#fff}
#topicMenu{position:absolute;right:0;top:48px;width:min(420px,86vw);background:#fff;color:#1f2937;border-radius:20px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);display:flex;flex-wrap:wrap;gap:8px}
#topicMenu[hidden]{display:none}
#topicMenu button{font-family:var(--font-d);font-weight:600;font-size:18px;border:2px solid #e2e8f0;background:#f8fafc;border-radius:14px;padding:8px 12px;cursor:pointer;color:#1f2937}
#topicMenu button:hover{border-color:var(--accent)}
#topicMenu button.done{opacity:.55}

#wheelzone{position:fixed;z-index:10;left:0;top:0;bottom:0;width:100%;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;padding-bottom:3.6vh;transition:width .9s cubic-bezier(.2,.8,.2,1)}
body.has-card #wheelzone{width:50%}
#spin{pointer-events:auto;font-family:var(--font-d);font-weight:700;font-size:34px;letter-spacing:.5px;color:var(--btn-ink);background:var(--btn);border:0;border-radius:24px;padding:14px 48px;cursor:pointer;box-shadow:0 7px 0 var(--btn-edge),0 16px 26px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,filter .2s}
#spin:hover{filter:brightness(1.06)}
#spin:active{transform:translateY(5px);box-shadow:0 2px 0 var(--btn-edge),0 6px 12px rgba(0,0,0,.25)}
#spin:disabled{filter:saturate(.45) brightness(.95);cursor:default}
body:not(.has-card):not(.spinning) #spin{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#hint{font-family:var(--font-d);font-weight:600;font-size:19px;max-width:min(92vw,560px);text-align:center;background:var(--brand-bg,rgba(10,30,60,.28));padding:5px 14px;border-radius:999px;color:var(--title-ink);text-shadow:var(--title-shadow);opacity:.95}
body.has-card #hint,body.spinning #hint{visibility:hidden}

#card{position:fixed;z-index:12;right:24px;top:68px;width:calc(52% - 36px);max-width:880px;max-height:calc(100vh - 80px);overflow:auto;background:var(--card);color:var(--card-ink);border-radius:var(--radius);border:var(--card-border);box-shadow:var(--card-shadow);padding:16px 24px 16px;transform-origin:left center;transform:perspective(1400px) rotateY(-75deg) translateX(80px);opacity:0;pointer-events:none;transition:transform .75s cubic-bezier(.2,.9,.25,1.08),opacity .35s}
body.has-card #card{transform:none;opacity:1;pointer-events:auto}
#card.flip .c-body{animation:flipin .55s cubic-bezier(.2,.9,.25,1.06)}
@keyframes flipin{0%{transform:perspective(1200px) rotateX(-70deg);opacity:0}100%{transform:none;opacity:1}}
.c-body{transform-origin:top center}

.c-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.topic{display:flex;align-items:center;gap:12px;min-width:0}
.t-ico{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--idea);border:3px solid var(--accent)}
.t-name{font-family:var(--font-d);font-weight:700;font-size:28px;line-height:1.1;color:var(--accent)}
.c-tools{display:flex;gap:8px;flex:none;align-items:center}
.tool{width:46px;height:46px;border-radius:14px;border:0;background:var(--tool);color:var(--tool-ink);font-size:22px;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.tool:hover{transform:translateY(-2px)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.swapbar{display:none;font-family:var(--font-d);font-weight:700;font-size:22px;color:var(--accent-ink);background:var(--accent);border-radius:14px;padding:6px 14px;margin-bottom:10px}
#card.swap .swapbar{display:block;animation:pop .3s}
.q-step{font-family:var(--font-d);font-weight:600;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-right:4px;white-space:nowrap}
.q{font-family:var(--font-d);font-weight:700;font-size:clamp(36px,3.05vw,50px);line-height:1.14;color:var(--card-ink);text-wrap:balance;margin-bottom:10px}
.q.swapin{animation:qin .4s cubic-bezier(.2,.9,.3,1.1)}
@keyframes qin{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
.q.veiled{cursor:pointer;color:var(--muted)}
#card.hideq .say{visibility:hidden}
.q.veiled .q-txt{display:none}
.q .q-veil{display:none}
.q.veiled .q-veil{display:inline}

.cap{font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:2px 0 8px;display:flex;align-items:center;gap:10px}
.cap button{font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:0;text-transform:none;border:2px dashed var(--idea-line);background:transparent;color:var(--card-ink);border-radius:10px;padding:2px 10px;cursor:pointer}

.cap .own{margin-left:auto;font-size:19px;border:2px dashed var(--accent);padding:3px 12px;border-radius:12px}
.cap .own.on{background:var(--accent);color:var(--accent-ink);border-style:solid;animation:pop .32s cubic-bezier(.2,1.3,.4,1)}
.ideas{display:grid;gap:8px;margin-bottom:12px;perspective:900px}
.ideas.n1{grid-template-columns:1fr}.ideas.n2{grid-template-columns:repeat(2,1fr)}.ideas.n3{grid-template-columns:repeat(3,1fr)}
.ideas.n4{grid-template-columns:repeat(2,1fr)}.ideas.n5,.ideas.n6{grid-template-columns:repeat(3,1fr)}
.idea{min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 10px;border-radius:20px;border:3px solid var(--idea-line);background:var(--idea);color:var(--idea-ink);cursor:pointer;transition:transform .14s,border-color .14s,background .14s,box-shadow .14s;transform-style:preserve-3d;will-change:transform;min-width:0}
.idea:hover{transform:translateY(-4px) rotateX(8deg);box-shadow:0 10px 18px rgba(15,23,42,.14)}
.idea:active{transform:translateY(1px) scale(.97)}
.idea.on{background:var(--idea-on);border-color:var(--idea-on-line);animation:pop .32s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.i-art{height:54px;display:grid;place-items:center;flex:none}
.i-art .emo{font-size:46px;line-height:1}
.i-art img{height:54px;max-width:110px;object-fit:contain;border-radius:10px}
.i-lab{font-family:var(--font-d);font-weight:600;font-size:clamp(26px,1.85vw,30px);line-height:1.08;text-align:center;min-width:0}
.ideas.wide .idea{flex-direction:row;justify-content:flex-start;gap:12px;min-height:62px;padding:6px 14px}
.ideas.wide .i-art{height:46px}.ideas.wide .i-art .emo{font-size:38px}.ideas.wide .i-art img{height:46px;max-width:64px}
.ideas.wide .i-lab{text-align:left}
.idea.veil .i-lab{display:none}
.idea.veil{justify-content:center!important}
.idea.veil .i-art{height:70px}.idea.veil .i-art .emo{font-size:58px}.idea.veil .i-art img{height:70px;max-width:120px}
.ideas.wide .idea.veil .i-art{height:50px}.ideas.wide .idea.veil .i-art .emo{font-size:42px}.ideas.wide .idea.veil .i-art img{height:50px}
.ideas.pair{grid-template-columns:1fr auto 1fr;align-items:center}
.ideas.pair .idea{min-height:92px}
.ideas.pair .or{font-family:var(--font-d);font-weight:700;font-size:26px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{font-family:var(--font-b);font-weight:800;font-size:clamp(26px,1.9vw,30px);line-height:1.12;text-align:left;color:var(--chip-ink);background:var(--chip);border:2.5px solid var(--chip-line);border-radius:18px 18px 18px 6px;padding:6px 15px;cursor:pointer;transition:transform .12s,background .15s,color .15s;animation:chipin .45s cubic-bezier(.2,1.2,.4,1) both}
.chip:nth-child(2){animation-delay:.07s}.chip:nth-child(3){animation-delay:.14s}.chip:nth-child(4){animation-delay:.21s}.chip:nth-child(5){animation-delay:.28s}.chip:nth-child(n+6){animation-delay:.35s}
@keyframes chipin{0%{transform:translateY(12px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}

.nav{display:flex;align-items:center;gap:12px;margin:2px -24px -16px;padding:8px 24px 14px;position:sticky;bottom:-16px;background:var(--nav-bg,var(--card));border-radius:0 0 var(--radius) var(--radius)}
.nav .nbtn{font-family:var(--font-d);font-weight:700;font-size:26px;border-radius:18px;border:0;padding:10px 20px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.nav .back{background:var(--tool);color:var(--tool-ink);box-shadow:0 4px 0 rgba(15,23,42,.18)}
.nav .next{margin-left:auto;background:var(--btn);color:var(--btn-ink);box-shadow:0 5px 0 var(--btn-edge)}
.nav .nbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.nav .nbtn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;border:0;background:var(--idea-line);cursor:pointer;padding:0}
.dot.on{background:var(--accent);transform:scale(1.25)}

#notes{position:fixed;z-index:30;right:16px;bottom:16px;width:min(560px,94vw);max-height:70vh;overflow:auto;background:#fffdf5;color:#3f3a2e;border:2px solid #e7dfc6;border-radius:18px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35);font-size:16px;line-height:1.5}
#notes[hidden]{display:none}
#notes h3{font-family:var(--font-d);font-size:18px;margin:10px 0 4px;color:#7a5c12}
#notes h3:first-child{margin-top:0}
#notes .x{position:sticky;float:right;top:0;border:0;background:#f1ead2;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer}

@media (max-width:899px){
  body{overflow-y:auto}
  #stage{position:relative;height:46vh;min-height:300px;transition:height .5s}
  body:not(.has-card) #stage{height:72vh}
  #top{position:absolute;padding:10px 12px}
  .brand{font-size:17px;padding:6px 12px 6px 8px;gap:8px;max-width:52vw}.brand .logo{font-size:24px}
  .pill{font-size:13px;padding:7px 10px;white-space:nowrap}
  .top-tools{gap:6px}
  .ideas.wide .idea{flex-direction:column;gap:2px;min-height:86px}
  .ideas.wide .i-lab{text-align:center}
  #top{align-items:flex-start}
  #wheelzone,body.has-card #wheelzone{position:static;width:100%;padding:10px 0 12px;background:transparent}
  #spin{font-size:26px;padding:11px 36px}
  #hint{display:none}
  #card{position:static;width:auto;max-width:none;max-height:none;margin:0 10px 16px;padding:16px 16px;display:none;transform:none}
  body.has-card #card{display:block}
  .t-ico{width:44px;height:44px;font-size:24px}.t-name{font-size:23px}
  .q{font-size:27px}
  .i-lab{font-size:20px}.chip{font-size:20px}.nav .nbtn{font-size:20px;padding:9px 14px}
  .ideas.n3,.ideas.n5,.ideas.n6{grid-template-columns:repeat(2,1fr)}
  .idea{min-height:92px}
  .i-art{height:46px}.i-art .emo{font-size:38px}.i-art img{height:46px}
  .cap .own{font-size:16px}
  .q-step{display:none}
}
@media (prefers-reduced-motion:reduce){
  #card,.chip,.idea,.q.swapin,#card.flip .c-body{animation:none!important;transition:none!important}
  body:not(.has-card):not(.spinning) #spin{animation:none}
}

body.notrans *,body.notrans{transition:none!important;animation:none!important}

/* pony: Дарина. A sunny paddock, a rosette wheel, a pony trotting round, a cat. Black outlines and lime, her maths look. */

}
.t-ico{border:3px solid #111;background:#a3e635}

.tool{border:2.5px solid #111}

#spin{border:3px solid #111;box-shadow:0 7px 0 #111}

.dot{border:2px solid #111;background:#fff}

</style>

<script type="application/json" id="wheel-data">{"title": "Darina's Speaking Wheel", "icon": "🐴", "notes": "Conversation warm-up, 10-15 minutes, two or three topics at a time. Every topic is about her own life: horse riding, her cat, Roblox, Michael Jackson, dogs, New Year. Say the question aloud first, let her point at a picture, then ask for a short phrase. The first question on each topic is yes/no or a choice; the next two are still tiny. Use 🙈 to hide the written question and the starters when you want to check listening. No race, no points, no comparison with Yulia. In the next English lesson spin the wheel AFTER the young / old check (a picture of a child, Is he young or old?), not before; young / old stays off the wheel. Retired 17 Nov: Show and tell (on the page since October, and its toy dog now has the Dogs card). Retired 9 Nov: My school (school started again on 5 Nov and we talked about it that day; she did not want to go, so it is not an easy warm-up for now). Retired 3 Nov: My family (Denis questions belong to the family lessons), Songs (now Michael Jackson, with the film). Retired 26 Oct (they were exercises, not conversation): Happy or sad?, Where is it?, Hands up!.", "ideaLabels": "tap", "tip": "Take your time. You can ask for help.", "topics": [{"icon": "🐴", "name": "Horse riding", "ideas": [{"icon": "🐴", "label": "a pony"}, {"icon": "🐎", "label": "a horse"}, {"icon": "🥕", "label": "a carrot"}, {"icon": "🍎", "label": "an apple"}], "q": "Do you ride a pony?", "starters": ["Yes, I … / I ride a …"], "qnote": "She has riding lessons once a week, a pony first and horses later (her news, 13 Oct). On 29 Oct I modelled I ride a pony and she repeated it. Yes, I do is the short answer; I ride a pony is the long one.", "more": [{"q": "What does Darik eat?", "starters": ["He eats …"], "note": "Darik is her pony (29 Oct). She said he is «обжора», he eats a lot. A carrot and an apple are on the pictures; give one more food word only if she asks. He / she is still settling (12 Nov), so He eats … is the starter."}, {"q": "Is riding fun or scary?", "starters": ["It’s fun! / It’s scary!"], "note": "On 17 Nov she told me in Russian that they rode out to a field with obstacles and down a small hill, and Darik got a fright at rustling grass. She was due to ride on Wed 18 Nov; ask if she went. Stay in the present: past tense is not taught, so let her tell the story in Russian and give the English for one word only (a field, a hill)."}]}, {"icon": "🐱", "name": "My cat", "ideas": [{"img": "cat", "label": "my cat"}, {"icon": "😺", "label": "happy"}, {"icon": "😿", "label": "sad"}], "q": "Is your cat big or small?", "starters": ["He’s …"], "qnote": "Her cat Timosha is a ragdoll, a big breed. She may say it’s or she’s; accept any, model He’s big once.", "more": [{"q": "Where is he now?", "starters": ["He’s on / in / under the …"], "note": "Prepositions she knows (on, in, under, next to), now about her real cat. I don’t know is fine if he is in another room."}, {"q": "Is he happy or sad today?", "starters": ["He’s …"], "note": "Happy / sad from 8 Oct, used about something real. One word is enough first, then the phrase."}]}, {"icon": "🎮", "name": "Roblox", "ideas": [{"icon": "🌊", "label": "Escape Tsunami"}, {"icon": "🏇", "label": "the horse game"}, {"icon": "💦", "label": "Don’t Splash"}], "q": "Which game do you like?", "starters": ["I like …"], "qnote": "Her recent games: Escape Tsunami (22 Oct), Don’t Splash (3 Nov), and a horse riding game, «Элита конного спорта» (17 Nov). She points first, then I like …. Roblox is end-of-lesson fun, so this stays a short chat.", "more": [{"q": "Who do you play with?", "starters": ["I play with …"], "note": "Denis gave her a Roblox present for her birthday. Names come from her; do not suggest Diana (on 3 Nov she told of a falling-out)."}, {"q": "What do you do in the game?", "starters": ["I … / In the game, I …"], "note": "Known verbs: run, play, eat. On 27 Oct she built a house with a pool and a trampoline, so build may come up; give one new verb if she asks (jump, swim). Talk, not a task: one phrase is plenty."}]}, {"icon": "🕺", "name": "Michael Jackson", "ideas": [{"img": "guitar", "label": "Beat It"}, {"icon": "🕺", "label": "Billie Jean"}, {"icon": "🎬", "label": "the film"}], "q": "Do you like the film Michael?", "starters": ["Yes, I … / No, I …"], "qnote": "We watch a bit of «Michael» in English in every English lesson (29 Oct, 5 Nov). Same short answer as Do you have …? (Yes, I do / No, I don’t).", "more": [{"q": "What’s your favourite song?", "starters": ["My favourite song is … / I like …"], "note": "She asked for his songs herself; Beat It was read on 22 Oct, Billie Jean has not run yet. Any song is right, in any language."}, {"q": "What do you like in the film?", "starters": ["I like …"], "note": "She can point, name a song or a scene in Russian; give the English for one word if she needs it. Keep to what she enjoyed, not the hard scenes with the father, and not the How old are you? scene (young / old is next lesson’s check). Then ask me the same question."}]}, {"icon": "🐶", "name": "Dogs", "ideas": [{"img": "dog", "label": "a toy dog"}, {"icon": "🐕", "label": "a dog"}, {"icon": "🎾", "label": "a ball"}, {"icon": "🦴", "label": "a bone"}], "q": "Do you like big dogs or small dogs?", "starters": ["I like big … / I like small …"], "qnote": "She loves dogs: on 5 Nov she showed me her new soft toy dog and said, in Russian, that she wants to be a dog trainer (кинолог). Big / small met 8 Oct: model «I like big dogs» once. One word first, then I like … dogs.", "more": [{"q": "What’s your toy dog’s name?", "starters": ["His name is … / Her name is …"], "note": "A soft toy dog (5 Nov; on 17 Nov she talked about a big toy dog), not a real dog. Douglas may be the brand (6 Oct), so let her give the name and do not suggest one. She may show him. If she wants more: What colour is he?"}, {"q": "What dog do you want?", "starters": ["I want a … / I want a big dog."], "note": "On 17 Nov she said in Russian that she wants an овчарка. The English is a German shepherd: I say it once if she asks; a big dog is a fine answer. Then ask me the same question."}]}, {"icon": "🎄", "name": "New Year", "ideas": [{"icon": "🎄", "label": "a tree"}, {"icon": "🍪", "label": "biscuits"}, {"icon": "🎁", "label": "presents"}, {"icon": "❄️", "label": "snow"}], "q": "Do you like New Year?", "starters": ["Yes, I do! / No, I don’t."], "qnote": "On 17 Nov she told me this is her first New Year at home. Yes, I do is the same short answer as for Do you have …? One word is fine first.", "more": [{"q": "Do you make biscuits with Mum?", "starters": ["Yes, I do. / We make …"], "note": "Her news, 17 Nov: when they stay at home for New Year, she and Mum go shopping and make ginger biscuits. Biscuits is on the pictures; ginger only if she asks. This is her first New Year at home (other years they went away), so No, I don’t is an honest answer too; then ask This year?"}, {"q": "What do you like about New Year?", "starters": ["I like … / I like the …"], "note": "She can point at a picture first (a tree, biscuits, presents, snow), then I like …. Keep to the fun things at home; do not bring up trips to relatives. Then ask me the same question."}]}], "ideasStay": true}</script>

  var starters = cur.starters || t.starters || [];
  html += '<div class="c-body"><div class="c-head"><div class="topic"><span class="t-ico">' + (t.icon || '💬') + '</span><span class="t-name">' + esc(t.name) + '</span></div>' +
    '<div class="c-tools">' + (n > 1 ? '<span class="q-step">Question ' + (S.step + 1) + ' of ' + n + '</span>' : '') + '<button type="button" class="tool" id="tListen" aria-pressed="' + S.listen + '" title="Hide the question and the starters (I say the question myself)">🙈</button>' +
    '<button type="button" class="tool" id="tSwap" aria-pressed="' + S.swap + '" title="Swap: the pupil asks the question">🔁</button></div></div>';
  html += '<div class="swapbar">' + esc(D.swapText || 'Your turn: ask me!') + '</div>';
  html += '<h2 class="q swapin' + (S.listen ? ' veiled' : '') + '"><span class="q-txt">' + esc(cur.q) + '</span><span class="q-veil">🙈 Tap to show the question</span></h2>';
  if (S.step === 0 && pair) {
    html += '<div class="ideas pair">' + ideaHTML({ label: pair[0] }) + '<span class="or">or</span>' + ideaHTML({ label: pair[1] }) + '</div>';
  } else if ((S.step === 0 || D.ideasStay) && ideas.length) {
    html += '<div class="cap"><span>Ideas</span>' + (veil ? '<button type="button" id="showWords">Show words</button>' : '') + '<button type="button" class="own" id="ownIdea">✨ My own idea</button></div>' +
      '<div class="ideas n' + Math.min(ideas.length, 6) + (ideas.length >= 4 ? ' wide' : '') + '">' + ideas.map(function (o) { return ideaHTML(o, veil); }).join('') + '</div>';
  }
  if (starters.length) html += '<div class="say"><div class="cap">Sentence starters</div><div class="chips">' + starters.map(function (s) { return '<button type="button" class="chip">' + esc(s) + '</button>'; }).join('') + '</div></div>';
  var dots = ''; for (var i = 0; i < n; i++) dots += '<button type="button" class="dot' + (i === S.step ? ' on' : '') + '" data-i="' + i + '" aria-label="Question ' + (i + 1) + '"></button>';
  var lastQ = S.step >= n - 1;
  html += '<div class="nav"><button type="button" class="nbtn back" id="prevQ"' + (S.step === 0 ? ' disabled' : '') + ' aria-label="Back">←</button>' + (n > 1 ? '<div class="dots">' + dots + '</div>' : '') +
    (t.pairs && lastQ ? '<button type="button" class="nbtn back" id="again">Another one 🎲</button>' : '') +
    '<button type="button" class="nbtn next" id="nextQ">' + (lastQ ? 'Spin again 🎡' : 'Next question →') + '</button></div></div>';
  card.innerHTML = html;
  card.classList.toggle('swap', S.swap); card.classList.toggle('hideq', S.listen);
  if (fresh) { card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip'); card.scrollTop = 0; }
  // wiring
  card.querySelectorAll('.idea').forEach(function (b) {
    b.addEventListener('click', function () {
      var was = b.classList.contains('on');
      card.querySelectorAll('.idea').forEach(function (x) { x.classList.remove('on'); });
      b.classList.remove('veil');
      var ow = $('#ownIdea'); if (ow) ow.classList.remove('on');
      if (!was) { b.classList.add('on'); var r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 7); }
    });
  });
  var own = $('#ownIdea'); if (own) own.addEventListener('click', function () {
    card.querySelectorAll('.idea').forEach(function (x) { x.classList.remove('on'); });
    own.classList.toggle('on'); if (own.classList.contains('on')) { var r = own.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 7); }
  });
  card.querySelectorAll('.chip').forEach(function (b) {
    b.addEventListener('click', function () { var was = b.classList.contains('on'); card.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('on'); }); if (!was) b.classList.add('on'); });
  });
  var sw = $('#showWords'); if (sw) sw.addEventListener('click', function () { card.querySelectorAll('.idea.veil').forEach(function (x) { x.classList.remove('veil'); }); sw.remove(); });
  var q = card.querySelector('.q'); q.addEventListener('click', function () { q.classList.remove('veiled'); card.classList.remove('hideq'); });
  $('#tListen').addEventListener('click', function () { S.listen = !S.listen; this.setAttribute('aria-pressed', S.listen); q.classList.toggle('veiled', S.listen); card.classList.toggle('hideq', S.listen); });
  $('#tSwap').addEventListener('click', function () { S.swap = !S.swap; this.setAttribute('aria-pressed', S.swap); card.classList.toggle('swap', S.swap); });
  $('#prevQ').addEventListener('click', function () { if (S.step > 0) { S.step--; renderCard(); } });
  $('#nextQ').addEventListener('click', function () { if (S.step < n - 1) { S.step++; renderCard(); } else spin(); });
  var ag = $('#again'); if (ag) ag.addEventListener('click', function () { S.pair = -1; renderCard(true); });
  card.querySelectorAll('.dot').forEach(function (d) { d.addEventListener('click', function () { S.step = +d.dataset.i; renderCard(); }); });
  renderNotes();
}
function renderNotes() {
  var box = $('#notesBody'), t = topics[S.cur], html = '';
  if (D.notes) html += '<h3>About this wheel</h3><p>' + esc(D.notes) + '</p>';
  if (t) {
    var cur = questions(t)[S.step];
    if (t.note) html += '<h3>' + esc(t.name) + '</h3><p>' + esc(t.note) + '</p>';
    if (cur && cur.note) html += '<h3>This question</h3><p>' + esc(cur.note) + '</p>';
  }
  box.innerHTML = html || '<p>No notes for this card.</p>';
}
function buildMenu() {
  var m = $('#topicMenu'); m.innerHTML = '';
  topics.forEach(function (t, i) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = (t.icon || '') + ' ' + t.name; if (S.visited[i]) b.className = 'done';
    b.addEventListener('click', function () { m.hidden = true; spin(i); }); m.appendChild(b);
  });
}

/* ---------- start ---------- */
function start() {
  $('#brandIcon').textContent = D.icon || '🎡';
  if (D.tip) $('#hint').textContent = D.tip;
  $('#brandText').textContent = D.title || 'Speaking Wheel';
  document.title = D.title || 'Speaking Wheel';
  drawFace();
  var ok = false; try { ok = init3D(); } catch (e) { console.error(e); ok = false; }
  if (ok) { G.THREE_V3 = window.THREE.Vector3; }
  else {
    G = null; document.body.classList.add('no3d');
    var fl = $('#flat'); fl.hidden = false;
    var sky = T.sky || ['#7dd3fc', '#e0f2fe']; $('#stage').style.background = 'linear-gradient(' + sky.join(',') + ')';
    var base = QS.assets || (PM && PM.base);
    if (PM && base) setupLite(base);
    else { fl.querySelector('.f-wrap').appendChild(faceCv); faceCv.addEventListener('click', function () { spin(); }); }
  }
  if (PLATE && G) return plateSetup();
  layout(); buildMenu(); renderNotes();
  window.addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fontD = getComputedStyle(document.documentElement).getPropertyValue('--font-d').trim() || fontD; drawFace(); });
  $('#spin').addEventListener('click', function () { spin(); });
  $('#btnTopics').addEventListener('click', function () { var m = $('#topicMenu'); m.hidden = !m.hidden; });
  $('#btnNotes').addEventListener('click', function () { var n = $('#notes'); n.hidden = !n.hidden; });
  $('#notesClose').addEventListener('click', function () { $('#notes').hidden = true; });
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' && S.cur >= 0) { var b = $('#nextQ'); if (b && questions(topics[S.cur]).length - 1 > S.step) b.click(); }
    if (e.key === 'ArrowLeft' && S.cur >= 0) { var p = $('#prevQ'); if (p && !p.disabled) p.click(); }
  });
  requestAnimationFrame(function (t) { last = t; frame(t); });
  // test hooks: the pane may throttle animation frames, so tests step time by hand
  window.__wheel = { S: S, spin: spin, topics: topics, G: function () { return G; },
    still: function () { document.body.classList.add('notrans'); },
    step: function (sec) { var t = 0; while (t < sec) { tick(1 / 60); t += 1 / 60; } layout(); render(1 / 60); return { cur: S.cur, spinning: S.spinning, rot: S.rot }; } };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
