<title>Maria — words we learned</title>

<style>
  :root { --ink:#3a2e2a;
    --q-bg:#fffdf6; --q-fg:#3a2e2a; --q-line:#e6d3a8; --q-accent:#c2410c; --q-onaccent:#fff;
    --q-scrim:rgba(58,46,42,.55); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Fredoka','Segoe UI',system-ui,sans-serif; color:var(--ink);
    background:#fdf0d5;
    background-image: radial-gradient(#f6d9a0 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    padding:22px 16px; min-height:100vh;
  }
  .top {
    max-width:960px; margin:0 auto 20px; display:flex; flex-wrap:wrap;
    align-items:center; justify-content:space-between; gap:12px;
  }
  h1 { font-size:30px; font-weight:700; letter-spacing:.3px; }
  h1 .emo { font-size:30px; }
  .datepill {
    display:flex; align-items:center; gap:8px; background:#fff; border:3px solid var(--ink);
    border-radius:40px; padding:6px 8px 6px 16px; font-weight:600; font-size:15px;
    box-shadow:4px 4px 0 rgba(58,46,42,.85);
  }
  #dateSel {
    font:inherit; font-weight:700; font-size:15px; border:none; background:#ffdf9e;
    color:var(--ink); border-radius:30px; padding:6px 12px; cursor:pointer;
  }
  .hint { max-width:960px; margin:0 auto 18px; text-align:center; color:#8a6d4b; font-size:14px; }
  #grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
    gap:16px; max-width:960px; margin:0 auto;
  }
  .card {
    background:#fff; border:3px solid var(--ink); border-radius:20px;
    padding:16px 12px 14px; text-align:center;
    box-shadow:5px 6px 0 rgba(58,46,42,.9);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .pic {
    width:76px; height:76px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:42px; line-height:1; border:3px solid var(--ink); overflow:hidden;
  }
  .pic .letter { font-family:'Andika',sans-serif; font-weight:700; font-size:38px; color:#fff; }
  .picimg { width:72%; height:72%; object-fit:contain; display:block; margin:auto; }
  .word {
    font-family:'Andika','Comic Sans MS',sans-serif; font-weight:700; font-size:24px;
    line-height:1.12; cursor:pointer; user-select:none; padding:3px 6px; border-radius:10px;
    transition:transform .08s;
  }
  .word:active { transform:scale(.93); }
  .word .spk { font-size:15px; opacity:.55; }
  .reveal {
    font:inherit; font-weight:600; font-size:13px; border:2px solid var(--ink);
    background:#fff; color:var(--ink); border-radius:30px; padding:4px 14px; cursor:pointer;
  }
  .reveal:active { transform:translateY(1px); }
  .gloss { font-family:'Fredoka',sans-serif; font-size:16px; color:#6b4f36; min-height:19px; font-weight:500; }
  .gloss[dir="rtl"] { text-align:right; direction:rtl; }
  .gloss.hidden { visibility:hidden; }
  footer { text-align:center; color:#b79b74; font-size:12px; margin-top:26px; }
</style>
</head>

e morning", "g": "je prends parfois une douche le matin", "e": "🚿"}, {"w": "on Fridays and Saturdays", "g": "le vendredi et le samedi", "e": "📅"}, {"w": "at night", "g": "la nuit", "e": "🌙"}, {"w": "two times a month", "g": "deux fois par mois", "e": "📅"}, {"w": "what kind of music do you listen to?", "g": "quel genre de musique est-ce que tu écoutes ?", "e": "👂"}, {"w": "it hides", "g": "il se cache", "e": "🙈"}, {"w": "it's a bit scared of things", "g": "il a un peu peur de tout", "e": "😨"}, {"w": "it's got big black claws", "g": "il a de grandes griffes noires", "e": "⚫"}, {"w": "spiky sharp teeth", "g": "des dents pointues et acérées", "e": "🦷"}, {"w": "it hasn't got wings", "g": "il n'a pas d'ailes", "e": "🪽"}, {"w": "until he's six", "g": "jusqu'à ses six ans", "e": "6️⃣"}, {"w": "play dead", "g": "faire le mort", "e": "🎮"}]}, DATES = ["2026-09-09", "2026-09-02", "2026-08-19", "2026-08-12", "2026-08-06", "2026-07-28"];

  /* Show dates as "29 July 2026" but keep the ISO string as the option value (the DATA key). */
  const _MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fmtDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m ? (+m[3])+' '+_MONTHS[+m[2]-1]+' '+m[1] : iso; }
  DATES.forEach(d => { const o=document.createElement('option'); o.value=d; o.textContent=fmtDate(d); sel.appendChild(o); });

  /* Voice locked to Google UK English Female (same as Space Lotto / Dino Squad) */
  let vcVoice = null;
  function vcLoad(){
    const vs = speechSynthesis.getVoices();
    vcVoice =
      vs.find(v => v.name === 'Google UK English Female') ||
      vs.find(v => /google/i.test(v.name) && /en-GB/i.test(v.lang)) ||
      vs.find(v => /en-GB/i.test(v.lang) && /female|samantha|kate|serena|stephanie/i.test(v.name)) ||
      vs.find(v => /en-GB/i.test(v.lang)) ||
      vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){ vcLoad(); speechSynthesis.onvoiceschanged = vcLoad; }
  /* Chrome drops an utterance queued in the SAME tick as cancel(), and parks the
     queue when the tab has been idle — that is why the quiz sentence stayed silent
     until you tapped 🔊 (Dasha, 2026-08-25). resume() + a tick of delay fixes both.
     If no voice has loaded yet, wait for voiceschanged once rather than speaking
     into the void. */
  function speak(t){
    if(!('speechSynthesis'in window)) return;
    const go = () => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = vcVoice ? vcVoice.lang : 'en-GB'; u.rate=.9; u.pitch=1.0;
      if(vcVoice) u.voice = vcVoice;
      speechSynthesis.cancel();
      setTimeout(() => {
        try { speechSynthesis.resume(); } catch(e){}
        speechSynthesis.speak(u);
      }, 60);
    };
    if(!vcVoice && speechSynthesis.getVoices().length === 0){
      speechSynthesis.addEventListener('voiceschanged', function once(){
        speechSynthesis.removeEventListener('voiceschanged', once);

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  let qzQs = [], qzAt = 0, qzScore = 0, qzRecent = [];

  /* Options are shuffled per question, and a position is rejected if it would make a

  function qzOptions(correct, pool){
    const bag = shuffle(pool.filter(w => w !== correct)).slice(0, 3);
    let opts, at, tries = 0;
    do {
      opts = shuffle([correct, ...bag]);
      at = opts.indexOf(correct);

  function qzAnswer(btn, chosen, it){

    qzBody.querySelectorAll('.qz-opt').forEach(b => {

    qzBody.innerHTML = '<div class="qz-score">' + qzScore + ' / ' + qzQs.length + '</div>'
      + '<div style="opacity:.75">' + (qzScore === qzQs.length ? 'Every one right.'
        : qzScore * 2 >= qzQs.length ? 'Good going. Try the ones you missed again.'
        : 'Worth another run through these.') + '</div>';
    const again = document.createElement('button');
    again.className = 'qz-next'; again.type = 'button'; again.textContent = 'Try again';
    again.onclick = qzStart;
    qzBody.appendChild(again);
  }

  function qzClose(){ qz.hidden = true; if('speechSynthesis' in window) speechSynthesis.cancel(); }
  qzBtn.onclick = qzStart;
  document.getElementById('qzX').onclick = qzClose;
  qz.addEventListener('click', e => { if (e.target === qz) qzClose(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !qz.hidden) qzClose(); });

  function render(date){
    grid.innerHTML='';
    (DATA[date]||[]).forEach((it,i)=>{
      const acc = ACC[i % ACC.length];
      const card=document.createElement('div'); card.className='card';
      card.style.transform = 'rotate('+((i%2)?1.1:-1.1)+'deg)';

      const pic=document.createElement('div'); pic.className='pic';
      if(it.e){ pic.style.background=acc+'33';
        if(isImg(it.e)){ const im=document.createElement('img'); im.className='picimg'; im.src=it.e; im.alt=''; pic.appendChild(im); }
        else { pic.textContent=it.e; } }
      else { pic.style.background=acc; pic.innerHTML='<span class="letter">'+(it.w[0]||'?').toUpperCase()+'</span>'; }
      card.appendChild(pic);

      const w=document.createElement('div'); w.className='word'; w.style.color=acc;
      w.innerHTML=it.w+' <span class="spk">🔊</span>'; w.onclick=()=>speak(it.w);
      card.appendChild(w);

      if(it.g){
        const gl=document.createElement('div'); gl.className='gloss hidden'; gl.textContent=it.g;
        gl.dir = GLOSS_DIR; if(GLOSS_DIR==='rtl') gl.style.textAlign='right';
        const b=document.createElement('button'); b.className='reveal'; b.textContent=GLOSS_LABEL;
        b.style.borderColor=acc; b.style.color=acc; b.onclick=()=>gl.classList.toggle('hidden');
        card.appendChild(gl); card.appendChild(b);
      }
      grid.appendChild(card);
    });
  }
  sel.onchange=()=>render(sel.value);
  if(DATES.length){ sel.value=DATES[0]; render(DATES[0]); }
  else grid.innerHTML='<p style="text-align:center;color:#b79b74">No words yet.</p>';
</script>
</body>
</html>
